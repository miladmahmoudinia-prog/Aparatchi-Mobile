name: Operator native custom tab v2

on:
  push:
    branches: [main]
    paths:
      - 'modules/aparatchi-custom-tab/**'
      - 'scripts/test-operator-native-custom-tab-v2.mjs'
      - '.github/workflows/operator-native-custom-tab-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aparatchi-mobile-operator-native-custom-tab-v2
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npm run typecheck

      - name: Verify operator browser contract
        run: node scripts/test-operator-native-custom-tab-v2.mjs

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
        env:
          NODE_ENV: production

      - name: Verify native module compiles
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew app:compileReleaseKotlin
        env:
          NODE_ENV: production
