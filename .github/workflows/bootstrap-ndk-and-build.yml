name: Bootstrap NDK and Build APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-ndk-and-build.yml

permissions:
  actions: write
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      TOOL_ROOT: C:/actions-runner/tools
      ANDROID_HOME: C:/actions-runner/android-sdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install exact Android NDK once
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion
          set "VER=27.1.12297006"
          set "SRC=%TOOL_ROOT%\android-ndk-r27b"
          set "ZIP=%TOOL_ROOT%\downloads\android-ndk-r27b-windows.zip"
          set "TARGET=%ANDROID_HOME%\ndk\%VER%"
          set "EXPECTED_SIZE=781495902"
          set "SHA1=3bb7efc850cd0af7707854b7e0d5c3b6a7153703"
          set "URL=https://redirector.gvt1.com/edgedl/android/repository/android-ndk-r27b-windows.zip"

          if exist "!SRC!\source.properties" goto ndk_ready
          if not exist "%TOOL_ROOT%\downloads" mkdir "%TOOL_ROOT%\downloads"

          if exist "!ZIP!" (
            set "ZIP_OK=0"
            for %%F in ("!ZIP!") do if "%%~zF"=="!EXPECTED_SIZE!" (
              certutil -hashfile "!ZIP!" SHA1 | findstr /I "!SHA1!" >nul 2>&1
              if not errorlevel 1 set "ZIP_OK=1"
            )
            if "!ZIP_OK!"=="0" del /q "!ZIP!"
          )

          if not exist "!ZIP!" type nul > "!ZIP!"
          echo Downloading Android NDK r27b once from the working Google CDN route...
          curl.exe -fL -C - --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 7200 -o "!ZIP!" "!URL!" || exit /b 11

          for %%F in ("!ZIP!") do if not "%%~zF"=="!EXPECTED_SIZE!" exit /b 12
          certutil -hashfile "!ZIP!" SHA1 | findstr /I "!SHA1!" >nul 2>&1 || exit /b 13

          if exist "!SRC!" rmdir /s /q "!SRC!"
          tar.exe -xf "!ZIP!" -C "%TOOL_ROOT%" || exit /b 14
          if not exist "!SRC!\source.properties" exit /b 15

          :ndk_ready
          if not exist "%ANDROID_HOME%\ndk" mkdir "%ANDROID_HOME%\ndk"
          if exist "!TARGET!\source.properties" goto target_ready
          if exist "!TARGET!" rmdir "!TARGET!" >nul 2>&1
          mklink /J "!TARGET!" "!SRC!" >nul 2>&1 || (
            robocopy "!SRC!" "!TARGET!" /E /NFL /NDL /NJH /NJS /NP
            if errorlevel 8 exit /b 16
          )

          :target_ready
          if not exist "!TARGET!\build\cmake\android.toolchain.cmake" exit /b 17
          echo Persistent NDK ready: !TARGET!
          endlocal

      - name: Install Android 16 SDK packages once
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion
          set "PLATFORM_TARGET=%ANDROID_HOME%\platforms\android-36"
          set "BUILD_TARGET=%ANDROID_HOME%\build-tools\36.0.0"
          set "PLATFORM_ZIP=%TOOL_ROOT%\downloads\platform-36_r02.zip"
          set "BUILD_ZIP=%TOOL_ROOT%\downloads\build-tools_r36_windows.zip"
          set "PLATFORM_SIZE=65878410"
          set "PLATFORM_SHA1=2c1a80dd4d9f7d0e6dd336ec603d9b5c55a6f576"
          set "BUILD_SIZE=58699878"
          set "BUILD_SHA1=f16ccffd34de8790dede813a6c7d8e2c11a27b50"
          set "PLATFORM_URL=https://redirector.gvt1.com/edgedl/android/repository/platform-36_r02.zip"
          set "BUILD_URL=https://redirector.gvt1.com/edgedl/android/repository/build-tools_r36_windows.zip"

          if exist "!PLATFORM_TARGET!\android.jar" if exist "!BUILD_TARGET!\aapt2.exe" goto sdk_ready
          if not exist "%TOOL_ROOT%\downloads" mkdir "%TOOL_ROOT%\downloads"

          if not exist "!PLATFORM_TARGET!\android.jar" (
            set "PLATFORM_SRC="
            for /d %%U in ("C:\Users\*") do if not defined PLATFORM_SRC if exist "%%~fU\AppData\Local\Android\Sdk\platforms\android-36\android.jar" set "PLATFORM_SRC=%%~fU\AppData\Local\Android\Sdk\platforms\android-36"
            if not defined PLATFORM_SRC if exist "C:\Android\Sdk\platforms\android-36\android.jar" set "PLATFORM_SRC=C:\Android\Sdk\platforms\android-36"
            if defined PLATFORM_SRC (
              echo Reusing Android platform 36 from !PLATFORM_SRC!
              if not exist "%ANDROID_HOME%\platforms" mkdir "%ANDROID_HOME%\platforms"
              if exist "!PLATFORM_TARGET!" rmdir /s /q "!PLATFORM_TARGET!" >nul 2>&1
              mklink /J "!PLATFORM_TARGET!" "!PLATFORM_SRC!" >nul 2>&1
              if errorlevel 1 (
                robocopy "!PLATFORM_SRC!" "!PLATFORM_TARGET!" /E /NFL /NDL /NJH /NJS /NP
                if errorlevel 8 exit /b 30
              )
            )
          )

          if not exist "!PLATFORM_TARGET!\android.jar" (
            if exist "!PLATFORM_ZIP!" (
              set "ZIP_OK=0"
              for %%F in ("!PLATFORM_ZIP!") do if "%%~zF"=="!PLATFORM_SIZE!" (
                certutil -hashfile "!PLATFORM_ZIP!" SHA1 | findstr /I "!PLATFORM_SHA1!" >nul 2>&1
                if not errorlevel 1 set "ZIP_OK=1"
              )
              if "!ZIP_OK!"=="0" del /q "!PLATFORM_ZIP!"
            )
            if not exist "!PLATFORM_ZIP!" type nul > "!PLATFORM_ZIP!"
            echo Downloading Android SDK Platform 36 once...
            curl.exe -fL -C - --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 3600 -o "!PLATFORM_ZIP!" "!PLATFORM_URL!" || exit /b 31
            for %%F in ("!PLATFORM_ZIP!") do if not "%%~zF"=="!PLATFORM_SIZE!" exit /b 32
            certutil -hashfile "!PLATFORM_ZIP!" SHA1 | findstr /I "!PLATFORM_SHA1!" >nul 2>&1 || exit /b 33

            set "PLATFORM_TMP=%TOOL_ROOT%\extract-platform-36"
            if exist "!PLATFORM_TMP!" rmdir /s /q "!PLATFORM_TMP!"
            mkdir "!PLATFORM_TMP!" || exit /b 34
            tar.exe -xf "!PLATFORM_ZIP!" -C "!PLATFORM_TMP!" || exit /b 35
            set "PLATFORM_SRC="
            for /r "!PLATFORM_TMP!" %%F in (android.jar) do if not defined PLATFORM_SRC set "PLATFORM_SRC=%%~dpF"
            if not defined PLATFORM_SRC exit /b 36
            if not exist "%ANDROID_HOME%\platforms" mkdir "%ANDROID_HOME%\platforms"
            if exist "!PLATFORM_TARGET!" rmdir /s /q "!PLATFORM_TARGET!"
            robocopy "!PLATFORM_SRC!" "!PLATFORM_TARGET!" /E /NFL /NDL /NJH /NJS /NP
            if errorlevel 8 exit /b 37
            rmdir /s /q "!PLATFORM_TMP!"
          )

          if not exist "!BUILD_TARGET!\aapt2.exe" (
            set "BUILD_SRC="
            for /d %%U in ("C:\Users\*") do if not defined BUILD_SRC if exist "%%~fU\AppData\Local\Android\Sdk\build-tools\36.0.0\aapt2.exe" set "BUILD_SRC=%%~fU\AppData\Local\Android\Sdk\build-tools\36.0.0"
            if not defined BUILD_SRC if exist "C:\Android\Sdk\build-tools\36.0.0\aapt2.exe" set "BUILD_SRC=C:\Android\Sdk\build-tools\36.0.0"
            if defined BUILD_SRC (
              echo Reusing Android build-tools 36.0.0 from !BUILD_SRC!
              if not exist "%ANDROID_HOME%\build-tools" mkdir "%ANDROID_HOME%\build-tools"
              if exist "!BUILD_TARGET!" rmdir /s /q "!BUILD_TARGET!" >nul 2>&1
              mklink /J "!BUILD_TARGET!" "!BUILD_SRC!" >nul 2>&1
              if errorlevel 1 (
                robocopy "!BUILD_SRC!" "!BUILD_TARGET!" /E /NFL /NDL /NJH /NJS /NP
                if errorlevel 8 exit /b 40
              )
            )
          )

          if not exist "!BUILD_TARGET!\aapt2.exe" (
            if exist "!BUILD_ZIP!" (
              set "ZIP_OK=0"
              for %%F in ("!BUILD_ZIP!") do if "%%~zF"=="!BUILD_SIZE!" (
                certutil -hashfile "!BUILD_ZIP!" SHA1 | findstr /I "!BUILD_SHA1!" >nul 2>&1
                if not errorlevel 1 set "ZIP_OK=1"
              )
              if "!ZIP_OK!"=="0" del /q "!BUILD_ZIP!"
            )
            if not exist "!BUILD_ZIP!" type nul > "!BUILD_ZIP!"
            echo Downloading Android Build-Tools 36.0.0 once...
            curl.exe -fL -C - --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 3600 -o "!BUILD_ZIP!" "!BUILD_URL!" || exit /b 41
            for %%F in ("!BUILD_ZIP!") do if not "%%~zF"=="!BUILD_SIZE!" exit /b 42
            certutil -hashfile "!BUILD_ZIP!" SHA1 | findstr /I "!BUILD_SHA1!" >nul 2>&1 || exit /b 43

            set "BUILD_TMP=%TOOL_ROOT%\extract-build-tools-36"
            if exist "!BUILD_TMP!" rmdir /s /q "!BUILD_TMP!"
            mkdir "!BUILD_TMP!" || exit /b 44
            tar.exe -xf "!BUILD_ZIP!" -C "!BUILD_TMP!" || exit /b 45
            set "BUILD_SRC="
            for /r "!BUILD_TMP!" %%F in (aapt2.exe) do if not defined BUILD_SRC set "BUILD_SRC=%%~dpF"
            if not defined BUILD_SRC exit /b 46
            if not exist "%ANDROID_HOME%\build-tools" mkdir "%ANDROID_HOME%\build-tools"
            if exist "!BUILD_TARGET!" rmdir /s /q "!BUILD_TARGET!"
            robocopy "!BUILD_SRC!" "!BUILD_TARGET!" /E /NFL /NDL /NJH /NJS /NP
            if errorlevel 8 exit /b 47
            rmdir /s /q "!BUILD_TMP!"
          )

          :sdk_ready
          if not exist "!PLATFORM_TARGET!\android.jar" (
            echo ERROR: Android platform 36 is still missing.
            exit /b 50
          )
          if not exist "!BUILD_TARGET!\aapt2.exe" (
            echo ERROR: Android build-tools 36.0.0 are still missing.
            exit /b 51
          )
          echo Android platform 36 and build-tools 36.0.0 are persistent and ready.
          endlocal

      - name: Launch normal APK workflow
        shell: cmd
        run: |
          @echo off
          curl.exe -fL -X POST ^
            -H "Accept: application/vnd.github+json" ^
            -H "Authorization: Bearer %GH_TOKEN%" ^
            -H "X-GitHub-Api-Version: 2022-11-28" ^
            "https://api.github.com/repos/%GITHUB_REPOSITORY%/actions/workflows/android-apk.yml/dispatches" ^
            -d "{\"ref\":\"main\"}" || exit /b 20
          echo Normal Build Android APK workflow dispatched.
