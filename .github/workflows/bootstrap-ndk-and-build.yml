name: Bootstrap NDK and Build APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-ndk-and-build.yml
      - .github/workflows/android-apk.yml
      - scripts/bootstrap-android-sdk.cmd

permissions:
  actions: write
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Launch normal APK workflow
        shell: cmd
        run: |
          @echo off
          curl.exe -fL -X POST ^
            -H "Accept: application/vnd.github+json" ^
            -H "Authorization: Bearer %GH_TOKEN%" ^
            -H "X-GitHub-Api-Version: 2022-11-28" ^
            "https://api.github.com/repos/%GITHUB_REPOSITORY%/actions/workflows/android-apk.yml/dispatches" ^
            -d "{\"ref\":\"main\"}" || exit /b 20
          echo Normal Build Android APK workflow dispatched.
