name: Bootstrap NDK and Build APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-ndk-and-build.yml

permissions:
  actions: write
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Install exact Android NDK once
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '27.1.12297006'
          $toolRoot = 'C:\actions-runner\tools'
          $downloads = Join-Path $toolRoot 'downloads'
          $zip = Join-Path $downloads 'android-ndk-r27b-windows.zip'
          $src = Join-Path $toolRoot 'android-ndk-r27b'
          $sdk = 'C:\actions-runner\android-sdk'
          $target = Join-Path $sdk "ndk\$ver"
          $expectedSize = 781495902
          $expectedSha1 = '3bb7efc850cd0af7707854b7e0d5c3b6a7153703'
          $url = 'https://redirector.gvt1.com/edgedl/android/repository/android-ndk-r27b-windows.zip'

          if (-not (Test-Path (Join-Path $src 'source.properties'))) {
            New-Item -ItemType Directory -Force -Path $downloads | Out-Null
            if (Test-Path $zip) {
              $len = (Get-Item $zip).Length
              if ($len -gt $expectedSize) { Remove-Item -Force $zip }
            }
            if (-not (Test-Path $zip)) { New-Item -ItemType File -Path $zip | Out-Null }
            Write-Host 'Downloading Android NDK r27b once. This file is kept for all later APK builds.'
            & curl.exe -fL -C - --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 7200 -o $zip $url
            if ($LASTEXITCODE -ne 0) { throw 'NDK download failed.' }
            $size = (Get-Item $zip).Length
            if ($size -ne $expectedSize) { throw "NDK size mismatch: $size" }
            $sha1 = (Get-FileHash -Algorithm SHA1 $zip).Hash.ToLowerInvariant()
            if ($sha1 -ne $expectedSha1) { throw "NDK SHA1 mismatch: $sha1" }
            if (Test-Path $src) { Remove-Item -Recurse -Force $src }
            & tar.exe -xf $zip -C $toolRoot
            if ($LASTEXITCODE -ne 0) { throw 'NDK extraction failed.' }
          }

          if (-not (Test-Path (Join-Path $src 'source.properties'))) { throw 'NDK source.properties is missing after extraction.' }
          New-Item -ItemType Directory -Force -Path (Join-Path $sdk 'ndk') | Out-Null
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          New-Item -ItemType Junction -Path $target -Target $src | Out-Null
          if (-not (Test-Path (Join-Path $target 'build\cmake\android.toolchain.cmake'))) { throw 'NDK junction verification failed.' }
          Write-Host "Persistent NDK ready at $target"

      - name: Launch normal APK workflow
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $($env:GH_TOKEN)"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'Aparatchi-SelfHosted-Runner'
          }
          $uri = "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/actions/workflows/android-apk.yml/dispatches"
          Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType 'application/json' -Body '{"ref":"main"}'
          Write-Host 'Normal Build Android APK workflow dispatched.'
