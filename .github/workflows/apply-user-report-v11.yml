name: Apply user report v11 mobile fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-user-report-v11.mjs'
      - 'scripts/verify-user-report-v11.mjs'
      - '.github/workflows/apply-user-report-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: self-hosted
    timeout-minutes: 25
    env:
      FIX_ROOT: C:\a-mobile-v11
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare persistent tools
        run: |
          @echo off
          set "PATH=C:\actions-runner\tools\mingit\cmd;C:\actions-runner\_work\_tool\node\22.23.2\x64;%PATH%"
          where git || exit /b 1
          where node || exit /b 1
          where npm || exit /b 1

      - name: Clone current main
        run: |
          @echo off
          set "PATH=C:\actions-runner\tools\mingit\cmd;C:\actions-runner\_work\_tool\node\22.23.2\x64;%PATH%"
          if exist "%FIX_ROOT%" rmdir /s /q "%FIX_ROOT%"
          git clone --depth=20 "https://x-access-token:%GH_TOKEN%@github.com/miladmahmoudinia-prog/Aparatchi-Mobile.git" "%FIX_ROOT%" || exit /b 1
          cd /d "%FIX_ROOT%"
          git checkout main || exit /b 1

      - name: Apply audited mobile fixes
        run: |
          @echo off
          set "PATH=C:\actions-runner\tools\mingit\cmd;C:\actions-runner\_work\_tool\node\22.23.2\x64;%PATH%"
          cd /d "%FIX_ROOT%"
          node scripts\apply-user-report-v11.mjs || exit /b 1
          node scripts\verify-user-report-v11.mjs || exit /b 1

      - name: Install JS dependencies
        run: |
          @echo off
          set "PATH=C:\actions-runner\tools\mingit\cmd;C:\actions-runner\_work\_tool\node\22.23.2\x64;%PATH%"
          cd /d "%FIX_ROOT%"
          npm install --ignore-scripts --no-audit --no-fund || exit /b 1

      - name: TypeScript check
        run: |
          @echo off
          set "PATH=C:\actions-runner\tools\mingit\cmd;C:\actions-runner\_work\_tool\node\22.23.2\x64;%PATH%"
          cd /d "%FIX_ROOT%"
          npx tsc --noEmit || exit /b 1

      - name: Commit verified mobile fixes
        run: |
          @echo off
          set "PATH=C:\actions-runner\tools\mingit\cmd;C:\actions-runner\_work\_tool\node\22.23.2\x64;%PATH%"
          cd /d "%FIX_ROOT%"
          git config user.name "aparatchi-mobile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add App.tsx src\contentService.ts
          git diff --cached --quiet && (echo No source changes to commit. & exit /b 0)
          git commit -m "fix: fresh startup detail truth and navigation v11" || exit /b 1
          git pull --rebase origin main || exit /b 1
          git push origin HEAD:main || exit /b 1
