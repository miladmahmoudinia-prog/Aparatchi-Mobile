name: PR final device v21

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pr-final-device-v21-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair-test-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 100
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply final direct Mobile repair
        run: node scripts/fix-final-device-batch-v21.mjs

      - name: Remove temporary collection guard
        run: git rm -f --ignore-unmatch src/collectionFlatListGuard.tsx

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Type-check direct application source
        run: npm run typecheck

      - name: Run Mobile regressions
        run: node --test scripts/tests/*.test.mjs

      - name: Audit requested behavior and preserved startup
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const posterNameFa = String(item.nameFa || item.name || '').trim();" App.tsx
          grep -F "let collectionBrowserScrollOffset = 0;" App.tsx
          grep -F "contentOffset={{ x: 0, y: collectionBrowserScrollOffset }}" App.tsx
          grep -F "onScroll={rememberCollectionBrowserOffset}" App.tsx
          grep -F "const relatedBadges = itemPosterBadges(relatedItem);" App.tsx
          grep -F "badge.kind === 'operator' && styles.posterOperatorAccess" App.tsx
          grep -F "? (item.latestEpisode || newestEpisodeGroup(item))" App.tsx
          grep -A12 -F "style={styles.homeScroll}" App.tsx | grep -F "removeClippedSubviews"
          ! grep -A12 -F "style={styles.homeScroll}" App.tsx | grep -F "removeClippedSubviews={false}"
          grep -F "removeClippedSubviews={false}" App.tsx
          grep -F "installStartupContentGate" index.ts
          ! grep -F "installCollectionFlatListGuard" index.ts
          test -f src/startupContentGate.ts
          test ! -f src/collectionFlatListGuard.tsx

      - name: Record final milestone and remove temporary repair machinery
        shell: bash
        run: |
          cat >> PROJECT-STATE.md <<'EOF'

# milestone Final reported device batch — 2026-08-18
- Movie/series poster cards keep the work's own identity; collection metadata cannot replace a work title.
- Collection folders/details use collection metadata only and collection Back restores the exact previous vertical pixel offset for both header Back and Android hardware Back.
- Related cards reuse truthful dubbed, Persian-subtitle and verified mobile-operator badges.
- Cold-start bootstrap gate remains installed before App loads so the compact bootstrap wins the initial network race against the full catalog.
- Home vertical scrolling uses smaller batches/native clipping while sensitive horizontal RTL rails remain unclipped; series cards prefer precomputed latestEpisode metadata.
- The fixes now live directly in App.tsx. Temporary Metro source-patching machinery and one-shot red repair workflows were removed.
- TypeScript and the existing Mobile regression suite passed before this commit. No APK was built.
EOF
          git rm -f --ignore-unmatch \
            scripts/fix-final-user-batch-v19.mjs \
            scripts/fix-home-scroll-performance-v20.mjs \
            scripts/fix-final-device-batch-v21.mjs \
            scripts/mobile-source-patches.cjs \
            scripts/metro-app-patch-transformer.cjs \
            metro.config.js \
            .github/workflows/final-user-batch-v19.yml \
            .github/workflows/home-scroll-performance-v20.yml \
            .github/workflows/final-device-batch-v21.yml \
            .github/workflows/issue-final-device-v21.yml \
            .github/workflows/pr-final-device-v21.yml
          test ! -f metro.config.js
          test ! -f scripts/mobile-source-patches.cjs
          test ! -f scripts/metro-app-patch-transformer.cjs

      - name: Commit verified final state to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --check
          git commit -m "fix: finalize reported device batch [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
