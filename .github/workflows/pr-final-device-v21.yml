name: PR final device v21

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pr-final-device-v21-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair-test-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 100
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply final device repair
        run: node scripts/fix-final-device-batch-v21.mjs

      - name: Remove temporary collection guard
        run: git rm -f --ignore-unmatch src/collectionFlatListGuard.tsx

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Type-check
        run: npm run typecheck

      - name: Run Mobile regressions
        run: node --test scripts/tests/*.test.mjs

      - name: Audit requested behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const posterNameFa = String(item.nameFa || item.name || '').trim();" App.tsx
          grep -F "let collectionBrowserScrollOffset = 0;" App.tsx
          grep -F "contentOffset={{ x: 0, y: collectionBrowserScrollOffset }}" App.tsx
          grep -F "onScroll={rememberCollectionBrowserOffset}" App.tsx
          grep -F "const relatedBadges = itemPosterBadges(relatedItem);" App.tsx
          grep -F "badge.kind === 'operator' && styles.posterOperatorAccess" App.tsx
          grep -F "? (item.latestEpisode || newestEpisodeGroup(item))" App.tsx
          grep -A12 -F "style={styles.homeScroll}" App.tsx | grep -F "removeClippedSubviews"
          ! grep -A12 -F "style={styles.homeScroll}" App.tsx | grep -F "removeClippedSubviews={false}"
          grep -F "removeClippedSubviews={false}" App.tsx
          grep -F "installStartupContentGate" index.ts
          ! grep -F "installCollectionFlatListGuard" index.ts
          test -f src/startupContentGate.ts
          test ! -f src/collectionFlatListGuard.tsx

      - name: Record milestone and remove staging files
        shell: bash
        run: |
          cat >> PROJECT-STATE.md <<'EOF'

# milestone Final device fixes + Home scroll v21 — 2026-08-18
- Work cards always display the work's own title; collection metadata no longer overwrites a movie/series title in Mobile.
- Collection folder/detail identity comes only from collection metadata. Missing Persian collection names fall back to original collection names instead of borrowing an installment title.
- Collection browser stores exact vertical pixel offset and restores it after both header Back and Android hardware Back.
- Related-title cards now show the same truthful dubbed, Persian-subtitle and mobile-operator badges as normal poster cards.
- Temporary global collection FlatList monkeypatch was removed; the fixes now live directly in App.tsx.
- The separate startupContentGate is intentionally preserved in index.ts because it is the verified fix for the device cold-start/bootstrap-vs-full-index bandwidth race.
- Home vertical scrolling was optimized without undoing the stable RTL rail rule: outer Home uses native clipping and smaller render batches; horizontal Home/Stars rails remain removeClippedSubviews=false but mount smaller batches. Poster cards use precomputed latestEpisode before expensive fallback episode sorting.
- Four eager Home shelves remain unchanged so the previous no-content-until-scroll regression does not return.
- TypeScript and the full existing Mobile regression suite passed before this commit. No APK was built.
EOF
          git rm -f --ignore-unmatch \
            scripts/fix-final-user-batch-v19.mjs \
            scripts/fix-home-scroll-performance-v20.mjs \
            scripts/fix-final-device-batch-v21.mjs \
            .github/workflows/final-user-batch-v19.yml \
            .github/workflows/home-scroll-performance-v20.yml \
            .github/workflows/final-device-batch-v21.yml \
            .github/workflows/pr-final-device-v21.yml

      - name: Commit verified final state to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --check
          git commit -m "fix: finalize device batch and smooth Home scroll [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
