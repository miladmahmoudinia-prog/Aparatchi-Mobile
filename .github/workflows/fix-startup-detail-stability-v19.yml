name: Fix startup and detail stability v19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-startup-detail-stability-v19.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Patch only App.tsx
        run: python3 .github/patch-startup-detail-stability-v19.py

      - name: Verify startup/detail/back guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('App.tsx').read_text(encoding='utf-8')
          required = [
              'const STARTUP_MIN_VISIBLE_MS = 5000;',
              'const sameCatalogIdentityOrder = (left: CatalogItem[], right: CatalogItem[]) =>',
              'const mergeSupplementalContent = (nextContent: LoadedContent) => {',
              'const bootstrapContent = await loadBootstrapContent();',
              'void freshContentPromise',
              'mergeSupplementalContent(freshContent)',
              "item && (!item.detailPath || item.detailLoaded === true || (item.downloads?.length || 0) > 0)",
              'const detailHistoryRef = useRef<CatalogItem[]>([]);',
              'if (state.selectedItem) { closeOrBackDetail(); return true; }',
              'onOpenRelated={openNestedDetail}',
          ]
          for value in required:
              assert value in text, value

          cold_start = text.index("if (initialLoad && online && firstContent.source !== 'remote') {")
          cold_end = text.index("      const firstApplied = applyContent(firstContent);", cold_start)
          cold = text[cold_start:cold_end]
          assert 'const freshContent = await freshContentPromise;' not in cold, 'cold start must not await full index before first paint'
          assert cold.index('const freshContentPromise = loadContent(false);') < cold.index('const bootstrapContent = await loadBootstrapContent();')
          assert cold.index('const bootstrapContent = await loadBootstrapContent();') < cold.index('dismissStartup();')

          detail_start = text.index('function DetailModal({')
          detail_end = text.index('function PersonProfileModal({', detail_start)
          detail = text[detail_start:detail_end]
          ready_branch = detail.index('            <View style={styles.detailActions}>')
          episode = detail.rindex('<SeriesEpisodeShowcase')
          people = detail.rindex('<PeopleSection')
          assert ready_branch < episode < people, 'series episodes must render before hydrated-only people content'
          print('startup/detail/back guards: ok')
          PY
          if [ "$(git diff --name-only)" != "App.tsx" ]; then
            echo 'Unexpected modified file' >&2
            git diff --name-only >&2
            exit 1
          fi
          git diff --check

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Commit only App.tsx
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          if [ "$(git diff --cached --name-only)" != "App.tsx" ]; then
            echo 'Unexpected staged file' >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          git commit -m "fix: restore fast startup and stable detail layout [skip ci]"
          git push origin HEAD:main
