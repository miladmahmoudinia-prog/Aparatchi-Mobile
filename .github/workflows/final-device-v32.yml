name: Final Device Validation v32

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'fix-final-device-batch-v31'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix-final-device-batch-v31
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply scoped repair
        run: node scripts/fix-final-device-batch-v31.mjs

      - name: Install dependencies
        run: npm ci --include=dev

      - name: TypeScript check
        run: npm run typecheck

      - name: Regression tests
        run: node --test scripts/tests/*.test.mjs

      - name: Static audit
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const movieEndOverlayStart = Math.max(0, duration - 5);" App.tsx
          ! grep -F "duration - 120" App.tsx
          grep -F "onOpenRelated={openRelatedDetail}" App.tsx
          grep -F "pressRetentionOffset={{ top: 24, right: 24, bottom: 24, left: 24 }}" App.tsx
          grep -F "for (const item of usableCatalog)" App.tsx
          grep -F "installStartupContentGate" index.ts
          test ! -e src/collectionFlatListGuard.tsx

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/fix-final-device-batch-v31.mjs .github/workflows/final-device-v32.yml
          if ! grep -Fq "# milestone Final device interaction batch v31" PROJECT-STATE.md; then
            cat >> PROJECT-STATE.md <<'EOF'

# milestone Final device interaction batch v31 — 2026-08-19
- End cards appear in the final 5 seconds and remain available after completion; portrait/landscape overlays stay inside the player frame and respect safe areas.
- Next-episode artwork accepts a real episode still while rejecting recycled series artwork.
- Related-title navigation no longer builds a detail-by-detail Back stack.
- Poster tap responsiveness was improved without changing the current Home/menu scroll tuning.
- Category artwork performs a full-catalog fallback only for cards still missing a cover.
- Exact collection scroll restore and startup content gate were preserved.
- Validation: npm ci, TypeScript and all Mobile regression tests green in Final Device Validation v32. Physical-device feel still requires the next APK/device check.
EOF
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: polish player end cards and poster interaction"
          git push origin HEAD:fix-final-device-batch-v31
