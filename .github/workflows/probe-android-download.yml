name: Probe Android Download Routes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-android-download.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Probe official Android CDN routes
        shell: cmd
        run: |
          @echo off
          setlocal
          echo === dl.google.com ===
          curl.exe -I -L --connect-timeout 8 --max-time 20 "https://dl.google.com/android/repository/android-ndk-r27b-windows.zip" || echo FAILED_dl_google
          echo.
          echo === redirector.gvt1.com ===
          curl.exe -I -L --connect-timeout 8 --max-time 20 "https://redirector.gvt1.com/edgedl/android/repository/android-ndk-r27b-windows.zip" || echo FAILED_redirector_gvt1
          echo.
          echo === edgedl.me.gvt1.com ===
          curl.exe -I -L --connect-timeout 8 --max-time 20 "https://edgedl.me.gvt1.com/edgedl/android/repository/android-ndk-r27b-windows.zip" || echo FAILED_edgedl_gvt1
          endlocal
