name: Fix truthful detail pointer v8
# Source verification only. Never builds an APK.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-truthful-detail-pointer-v8.mjs'
      - 'scripts/test-truthful-detail-pointer-v8.mjs'
      - '.github/workflows/fix-truthful-detail-pointer-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-truthful-detail-pointer-v8
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply v8 detail repair
        run: node scripts/fix-truthful-detail-pointer-v8.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Verify detail/startup/media regressions
        run: |
          node scripts/test-truthful-detail-pointer-v8.mjs
          node scripts/test-visible-media-startup-v7.mjs
          node scripts/test-startup-projectionist.mjs
          node scripts/test-neutral-foreign-media-ui.mjs
          node scripts/test-stable-detail-fallback-v4.mjs
          node scripts/test-home-detail-render-v2.mjs
          node scripts/test-runtime-latency-v3.mjs
      - name: Commit validated source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contentService.ts
          if git diff --cached --quiet; then
            echo "Validated detail-pointer repair already current."
            exit 0
          fi
          git commit -m "fix: prefer source truth for detail shards [skip ci]"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
