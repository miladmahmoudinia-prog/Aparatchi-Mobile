name: One-shot startup freshness repair v17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/startup-freshness-v17.yml'

permissions:
  contents: write

concurrency:
  group: mobile-startup-freshness-v17
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Expose repair run id
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'run_id=%s\nhead_sha=%s\n' "${{ github.run_id }}" "${{ github.sha }}" > startup-v17-run.txt
          git add startup-v17-run.txt
          git commit -m "chore: expose startup v17 run id [skip ci]"
          git push origin HEAD:main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply startup patch
        run: node scripts/apply-startup-freshness-v17.mjs

      - name: Install dependencies
        run: npm install --include=dev

      - name: Type-check
        run: npm run typecheck

      - name: Commit repair and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/apply-startup-freshness-v17.mjs .github/workflows/startup-freshness-v17.yml startup-v17-run.txt
          git add App.tsx
          git commit -m "fix: bound cold start and prioritize fresh Home"
          git pull --rebase origin main
          git push origin HEAD:main
