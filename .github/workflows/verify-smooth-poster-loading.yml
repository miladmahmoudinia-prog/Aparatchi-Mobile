name: Verify smooth poster loading

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-smooth-poster-loading-fix.mjs
      - .github/workflows/verify-smooth-poster-loading.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-smooth-poster-loading
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Apply smooth poster loading repair
        run: node scripts/apply-smooth-poster-loading-fix.mjs

      - name: Type-check application
        run: npm run typecheck

      - name: Run smooth poster regression
        run: node --test scripts/tests/smooth-poster-loading.test.mjs

      - name: Commit verified poster loading fix
        run: |
          git config user.name "aparatchi-mobile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add App.tsx app.json package.json scripts/tests/smooth-poster-loading.test.mjs
          if git diff --cached --quiet; then
            echo "No poster loading changes to commit."
            exit 0
          fi
          git commit -m "fix: smooth progressive poster loading"
          git push origin HEAD:main
