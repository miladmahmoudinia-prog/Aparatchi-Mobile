name: Fix subtitle badge wording v12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-subtitle-badge-v12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch only subtitle badge wording
        shell: python
        run: |
          from pathlib import Path

          path = Path('App.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "badges.push({ id: 'language', label: 'دوبله + زیرنویس', kind: 'language' });",
                  "badges.push({ id: 'language', label: 'دوبله فارسی + زیرنویس فارسی', kind: 'language' });",
              ),
              (
                  "badges.push({ id: 'language', label: 'زیرنویس', kind: 'language' });",
                  "badges.push({ id: 'language', label: 'زیرنویس فارسی', kind: 'language' });",
              ),
              (
                  "badge: language === 'dubbed' ? 'دوبله فارسی' : 'زیرنویس',",
                  "badge: language === 'dubbed' ? 'دوبله فارسی' : 'زیرنویس فارسی',",
              ),
              (
                  "{group.language === 'dubbed' ? 'دوبله فارسی' : group.badge || (group.language === 'subtitled' ? 'زیرنویس' : 'دریافت')}",
                  "{group.language === 'dubbed' ? 'دوبله فارسی' : group.language === 'subtitled' ? 'زیرنویس فارسی' : group.badge || 'دریافت'}",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Verify exact UI changes
        shell: bash
        run: |
          set -euo pipefail
          grep -F "label: 'دوبله فارسی + زیرنویس فارسی', kind: 'language'" App.tsx
          grep -F "label: 'زیرنویس فارسی', kind: 'language'" App.tsx
          grep -F "badge: language === 'dubbed' ? 'دوبله فارسی' : 'زیرنویس فارسی'" App.tsx
          grep -F "group.language === 'subtitled' ? 'زیرنویس فارسی'" App.tsx
          if git diff --name-only | grep -v '^App.tsx$' | grep -q .; then
            echo "::error::Unexpected modified file"
            git diff --name-only
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Commit only App.tsx
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          if [ "$(git diff --cached --name-only)" != "App.tsx" ]; then
            echo "::error::Unexpected staged file"
            exit 1
          fi
          git commit -m "fix: clarify Persian subtitle badges [skip ci]"
          git push origin HEAD:main
