name: Fix fast startup media v5
# Verification-only workflow; it never builds or publishes an APK.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-fast-startup-media-v5.mjs'
      - 'scripts/test-fast-startup-media-v5.mjs'
      - '.github/workflows/fix-fast-startup-media-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-fast-startup-media-v5
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply fast startup and movie action repair
        run: node scripts/fix-fast-startup-media-v5.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npm run typecheck

      - name: Verify direct startup and movie media regression
        run: node scripts/test-fast-startup-media-v5.mjs

      - name: Verify Home first-frame regression
        run: node scripts/test-home-first-frame-v4.mjs

      - name: Verify Home/detail regression
        run: node scripts/test-home-detail-render-v2.mjs

      - name: Verify Home performance boundaries
        run: node scripts/test-home-performance-pass.mjs

      - name: Verify runtime latency regression
        run: node scripts/test-runtime-latency-v3.mjs

      - name: Verify startup projectionist
        run: node scripts/test-startup-projectionist.mjs

      - name: Verify neutral foreign media
        run: node scripts/test-neutral-foreign-media-ui.mjs

      - name: Verify RTL rails outside Home remain stable
        run: node scripts/test-rtl-media-rails.mjs

      - name: Verify poster stability
        run: node --test scripts/tests/smooth-poster-loading.test.mjs

      - name: Verify operator playback
        run: node scripts/test-operator-in-app-browser.mjs

      - name: Verify metadata and detail behavior
        run: |
          node --test scripts/tests/metadata-empty-state.test.mjs
          node scripts/test-detail-related-titles.mjs
          node scripts/test-series-next-episode-overlay.mjs
          node --test scripts/tests/exact-device-episode-thumbnails.test.mjs

      - name: Commit only after every verification is green
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx scripts/test-startup-projectionist.mjs
          if git diff --cached --quiet; then
            echo "Verified fast startup/movie action repair is already applied."
            exit 0
          fi
          git commit -m "perf: show movie actions without detail wait [skip ci]"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
