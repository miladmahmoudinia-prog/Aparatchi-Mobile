name: Apply catalog refresh hotfix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-catalog-refresh-fix.mjs'
      - '.github/workflows/apply-postverify-mobile-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-source-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Apply catalog refresh hotfix
        run: node scripts/apply-catalog-refresh-fix.mjs
      - name: Install dependencies
        run: npm ci
      - name: Type-check application
        run: npm run typecheck
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contentService.ts
          if git diff --cached --quiet; then
            echo "Catalog refresh source already fixed."
            exit 0
          fi
          git commit -m "fix: allow large catalog refresh to complete"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
