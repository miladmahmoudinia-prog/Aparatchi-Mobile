name: Final Device Batch v31

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: final-device-v31-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'fix-final-device-batch-v31'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix-final-device-batch-v31
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - id: patch
        name: Apply scoped mobile repair when pending
        shell: bash
        run: |
          if [ -f scripts/fix-final-device-batch-v31.mjs ]; then
            node scripts/fix-final-device-batch-v31.mjs
          else
            echo "Repair already applied; validating current branch state."
          fi

      - id: install
        name: Install dependencies
        run: npm ci --include=dev

      - id: typecheck
        name: TypeScript check
        run: npm run typecheck

      - id: tests
        name: Regression tests
        shell: bash
        run: |
          set +e
          node --test scripts/tests/*.test.mjs > mobile-tests-v32.log 2>&1
          STATUS=$?
          cat mobile-tests-v32.log
          exit "$STATUS"

      - id: audit
        name: Static audit
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const movieEndOverlayStart = Math.max(0, duration - 5);" App.tsx
          ! grep -F "duration - 120" App.tsx
          grep -F "onOpenRelated={openRelatedDetail}" App.tsx
          grep -F "pressRetentionOffset={{ top: 24, right: 24, bottom: 24, left: 24 }}" App.tsx
          grep -F "for (const item of usableCatalog)" App.tsx
          grep -F "installStartupContentGate" index.ts
          test ! -e src/collectionFlatListGuard.tsx

      - name: Record success marker only if needed
        shell: bash
        run: |
          set -euo pipefail
          rm -f mobile-tests-v32.log mobile-validation-v32.txt
          git status --short
