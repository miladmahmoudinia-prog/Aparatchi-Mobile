name: Verify final mobile audit v36 temp

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event.issue.title == 'RUN FINAL MOBILE AUDIT V36'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Run all regression scripts
        id: regressions
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(scripts/regression*.mjs scripts/*regression*.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No regression scripts found.' > /tmp/regression-failures.txt
            exit 1
          fi
          printf '%s\n' "${files[@]}" | sort -u > /tmp/regressions.txt
          : > /tmp/regression-failures.txt
          failed=0
          while IFS= read -r file; do
            echo "==> $file"
            if ! node "$file" > /tmp/one-regression.log 2>&1; then
              failed=1
              echo "FAIL: $file" >> /tmp/regression-failures.txt
              tail -n 25 /tmp/one-regression.log >> /tmp/regression-failures.txt
              echo >> /tmp/regression-failures.txt
            fi
          done < /tmp/regressions.txt
          exit "$failed"
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          detail='none'
          if [ -s /tmp/regression-failures.txt ]; then detail="$(head -c 6000 /tmp/regression-failures.txt)"; fi
          gh issue comment "$ISSUE_NUMBER" --body "typecheck=${TYPECHECK}\nregressions=${REGRESSIONS}\nrun=${RUN_ID}\nhead=$(git rev-parse HEAD)\n\`\`\`\n${detail}\n\`\`\`"
      - name: Fail on audit failure
        if: steps.typecheck.outcome != 'success' || steps.regressions.outcome != 'success'
        run: exit 1
