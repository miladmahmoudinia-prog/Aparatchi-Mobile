name: Verify final mobile audit v36 temp

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event.issue.title == 'RUN FINAL MOBILE AUDIT V36'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Run mobile regression suite
        id: regressions
        continue-on-error: true
        run: node --test scripts/tests/*.test.mjs
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          REGRESSIONS: ${{ steps.regressions.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: gh issue comment "$ISSUE_NUMBER" --body "typecheck=${TYPECHECK}\nregressions=${REGRESSIONS}\nrun=${RUN_ID}\nhead=$(git rev-parse HEAD)"
      - name: Fail on audit failure
        if: steps.typecheck.outcome != 'success' || steps.regressions.outcome != 'success'
        run: exit 1
