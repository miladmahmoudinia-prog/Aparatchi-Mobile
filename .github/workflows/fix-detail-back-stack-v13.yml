name: Fix detail back stack v13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-detail-back-stack-v13.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch detail navigation only
        run: python3 .github/patch-detail-back-stack-v13.py

      - name: Verify navigation regression scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('App.tsx').read_text(encoding='utf-8')
          required = [
              'const detailHistoryRef = useRef<CatalogItem[]>([]);',
              'const openRootDetail = useCallback((nextItem: CatalogItem) => {',
              'const openNestedDetail = useCallback((nextItem: CatalogItem) => {',
              'const closeOrBackDetail = useCallback(() => {',
              'if (state.selectedItem) { closeOrBackDetail(); return true; }',
              'onClose={closeOrBackDetail}',
              'onOpenRelated={openNestedDetail}',
          ]
          for value in required:
              assert value in text, value
          assert text.count('onOpen={openRootDetail}') == 4
          assert 'onOpenRelated={setSelectedItem}' not in text

          history = []
          current = 'katiusha'
          history.append(current)
          current = 'related-1'
          current = history.pop() if history else None
          assert current == 'katiusha'
          current = history.pop() if history else None
          assert current is None

          history = []
          current = 'pain-hustlers'
          history.append(current)
          current = 'goodfellas'
          assert history.pop() == 'pain-hustlers'
          print('detail stack regression semantics: ok')
          PY
          if git diff --name-only | grep -v '^App.tsx$' | grep -q .; then
            echo 'Unexpected modified file:' >&2
            git diff --name-only >&2
            exit 1
          fi
          git diff --check

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Commit only App.tsx
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          if [ "$(git diff --cached --name-only)" != "App.tsx" ]; then
            echo 'Unexpected staged file' >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          git commit -m "fix: preserve nested detail back history [skip ci]"
          git push origin HEAD:main
