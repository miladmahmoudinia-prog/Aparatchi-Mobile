name: Fix truthful startup cache v6
# Mobile source verification only. This workflow never builds an APK.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-truthful-startup-cache-v6.mjs'
      - 'scripts/test-truthful-startup-cache-v6.mjs'
      - '.github/workflows/fix-truthful-startup-cache-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-truthful-startup-cache-v6
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply truthful startup/cache repair
        run: node scripts/fix-truthful-startup-cache-v6.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Verify exact startup and cache regression
        run: |
          node scripts/test-startup-projectionist.mjs
          node scripts/test-truthful-startup-cache-v6.mjs

      - name: Verify existing catalog/detail regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            scripts/test-home-detail-regression.mjs \
            scripts/test-runtime-latency-v3.mjs \
            scripts/test-neutral-foreign-media-ui.mjs \
            scripts/test-operator-playback.mjs \
            scripts/test-metadata-empty-state.mjs; do
            if [ -f "$test" ]; then node "$test"; fi
          done

      - name: Commit only validated Mobile source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/contentService.ts scripts/test-startup-projectionist.mjs
          if git diff --cached --quiet; then
            echo "Validated Mobile repair is already current."
            exit 0
          fi
          git commit -m "fix: make startup refresh catalog truth before reveal [skip ci]"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
