name: Final performance v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-performance-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout final main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check final source
        run: npm run typecheck
      - name: Verify critical interaction performance
        run: node scripts/test-home-performance-pass.mjs
      - name: Verify compact catalog compatibility
        run: node scripts/test-compact-index-mobile-v2.mjs
      - name: Verify poster stability
        run: node --test scripts/tests/smooth-poster-loading.test.mjs
      - name: Verify metadata empty state
        run: node --test scripts/tests/metadata-empty-state.test.mjs
