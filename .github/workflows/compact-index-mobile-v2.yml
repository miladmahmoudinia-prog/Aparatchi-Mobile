name: Compact catalog mobile compatibility v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-compact-index-mobile-v2.mjs'
      - 'scripts/test-compact-index-mobile-v2.mjs'
      - '.github/workflows/compact-index-mobile-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-compact-index-v2
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Patch compact index compatibility
        run: node scripts/patch-compact-index-mobile-v2.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npm run typecheck

      - name: Verify compact index compatibility
        run: node scripts/test-compact-index-mobile-v2.mjs

      - name: Verify critical performance regression
        run: node scripts/test-home-performance-pass.mjs

      - name: Verify poster loading regression
        run: node --test scripts/tests/smooth-poster-loading.test.mjs

      - name: Verify metadata regression
        run: node --test scripts/tests/metadata-empty-state.test.mjs

      - name: Commit verified compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- App.tsx src/contentService.ts src/types.ts; then
            echo "No compatibility changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/contentService.ts src/types.ts
          git commit -m "perf: consume compact people index lazily"
          git pull --rebase origin main
          git push origin HEAD:main
