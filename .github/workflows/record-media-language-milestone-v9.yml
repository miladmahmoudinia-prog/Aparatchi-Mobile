name: Record media language milestone v9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-media-language-milestone-v9.yml'
      - 'scripts/record-media-language-milestone-v9.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Update PROJECT-STATE
        run: node scripts/record-media-language-milestone-v9.mjs
      - name: Commit PROJECT-STATE only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT-STATE.md
          if git diff --cached --quiet; then
            echo "Milestone already recorded."
            exit 0
          fi
          git commit -m "docs: record fresh startup and media language milestone [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
