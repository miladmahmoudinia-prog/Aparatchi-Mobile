name: One-shot collection navigation v18

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-write-lock
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == 'RUN COLLECTION NAVIGATION V18'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Expose run id
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'run_id=%s\nrun_attempt=%s\nstarted_at=%s\n' '${{ github.run_id }}' '${{ github.run_attempt }}' "$(date -u +%FT%TZ)" > collection-navigation-v18-status.log
          git add collection-navigation-v18-status.log
          git commit -m "chore: expose collection navigation v18 run id [skip ci]"
          git push origin HEAD:main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Patch collection navigation
        run: node scripts/patch-collection-navigation-v18.mjs

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Type-check
        run: npm run typecheck

      - name: Verify targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          grep -F "let collectionBrowserScrollOffset = 0;" App.tsx
          grep -F "const posterNameFa = String(item.nameFa || item.name || '').trim();" App.tsx
          grep -F "? rawFa" App.tsx
          grep -F ": titleEn;" App.tsx
          grep -F "ref={collectionFolderListRef}" App.tsx
          grep -F "scrollToOffset" App.tsx
          grep -F "collectionBrowserScrollOffset = Math.max(0, event.nativeEvent.contentOffset.y)" App.tsx
          ! grep -F "[A-Za-z]/.test(item.nameFa || '') && item.collectionNameFa" App.tsx

      - name: Commit repair and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat >> PROJECT-STATE.md <<'EOF'

# milestone Collection title truth + scroll restore v18 — 2026-08-18
- Individual movie/series cards no longer borrow `collectionNameFa` when their own Persian title is missing/Latin.
- Collection folders no longer manufacture a Persian collection label from the first member title; they use verified collection metadata, otherwise the original collection title.
- The collection-folder grid stores its exact native pixel offset and restores it after Back from a collection, for both header Back and Android hardware Back.
- Startup/cold-start logic was intentionally not changed in this patch.
EOF

          git rm -f scripts/patch-collection-navigation-v18.mjs .github/workflows/collection-navigation-v18.yml collection-navigation-v18-status.log
          if [ -f scripts/patch-collection-title-scroll-v18.mjs ]; then
            git rm -f scripts/patch-collection-title-scroll-v18.mjs
          fi
          git add App.tsx PROJECT-STATE.md
          git commit -m "fix: preserve collection title identity and Back scroll position"
          git pull --rebase origin main
          git push origin HEAD:main
