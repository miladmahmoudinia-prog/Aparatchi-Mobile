name: Apply Original Language Badge Fix

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/patch-original-language-badge.mjs'
      - '.github/workflows/apply-original-language-badge.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-source-write-lock
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest mobile source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply original-version badge support
        run: |
          node --check scripts/patch-original-language-badge.mjs
          node scripts/patch-original-language-badge.mjs
          grep -F "'dubbed' | 'subtitled' | 'original'" src/types.ts
          grep -F "label: 'نسخه اصلی'" App.tsx

      - name: Commit patched mobile source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/types.ts
          if git diff --cached --quiet; then
            echo "Mobile original-version badge support already applied."
            exit 0
          fi
          git commit -m "fix: show original-version badge on media cards"
          git pull --rebase origin main
          git push origin HEAD:main
