name: Apply user report v12-v13 mobile fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-user-report-v12.mjs'
      - 'scripts/apply-user-report-v13.mjs'
      - '.github/workflows/apply-user-report-v12.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-user-report-v12
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout mobile repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 30

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply audited mobile fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-user-report-v12.mjs')
          text = path.read_text()
          old = "  1,\n  'detail firstSeenAt normalization',"
          new = "  2,\n  'detail firstSeenAt normalization',"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif new not in text:
              raise SystemExit('v12 helper guard not found')
          PY
          node scripts/apply-user-report-v12.mjs
          node scripts/apply-user-report-v13.mjs

      - name: Verify behavioral markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'bootstrapRevision?: string;' src/contentService.ts
          grep -F 'manifest?.bootstrapRevision || manifest?.clientRevision || manifest?.revision' src/contentService.ts
          grep -F 'scrollToTopSignal={homeScrollTopSignal}' App.tsx
          grep -F "if (tab === 'home') setHomeScrollTopSignal" App.tsx
          grep -F "void reloadContent(true, { silent: true });" App.tsx
          grep -F "case 'indian-series': return false;" App.tsx
          grep -F 'if (language) return language === originalLanguage;' App.tsx
          grep -F 'heroSlider: { height: 420' App.tsx
          if grep -F 'foregroundRefreshVisible' App.tsx; then
            echo 'foreground full-screen refresh state still exists' >&2
            exit 1
          fi

      - name: Install JS dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Commit verified mobile fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-mobile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add App.tsx src/contentService.ts src/types.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix: startup state ordering regional categories and detail hydration v13"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          echo "::error::Could not push audited mobile fixes after 5 attempts."
          exit 1
