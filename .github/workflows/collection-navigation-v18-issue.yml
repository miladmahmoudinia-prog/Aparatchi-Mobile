name: Apply collection navigation v18

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.issue.title == 'RUN MOBILE COLLECTION V18'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Expose run id
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'run_id=%s\nstarted_at=%s\n' '${{ github.run_id }}' "$(date -u +%FT%TZ)" > collection-v18-run.txt
          git add collection-v18-run.txt
          git commit -m "chore: expose mobile collection v18 run [skip ci]"
          git push origin HEAD:main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply patch
        run: node scripts/patch-collection-navigation-v18.mjs

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Type-check
        run: npm run typecheck

      - name: Verify repair markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F "let collectionBrowserScrollOffset = 0;" App.tsx
          grep -F "const posterNameFa = String(item.nameFa || item.name || '').trim();" App.tsx
          grep -F "ref={collectionFolderListRef}" App.tsx
          grep -F "scrollToOffset" App.tsx
          grep -F "collectionBrowserScrollOffset = Math.max(0, event.nativeEvent.contentOffset.y)" App.tsx
          ! grep -F "[A-Za-z]/.test(item.nameFa || '') && item.collectionNameFa" App.tsx

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat >> PROJECT-STATE.md <<'EOF'

# milestone Collection identity + exact Back scroll v18 — 2026-08-18
- Movie/series cards always display the work's own title; collection metadata can no longer replace an individual title.
- Collection folders do not manufacture their title from the first member when Persian collection metadata is absent.
- Collection folder scroll offset is saved in pixels and restored exactly after Back.
- Startup/cold-start logic was not changed.
EOF
          git rm -f scripts/patch-collection-navigation-v18.mjs scripts/patch-collection-title-scroll-v18.mjs .github/workflows/collection-navigation-v18.yml .github/workflows/collection-navigation-v18-issue.yml collection-v18-run.txt 2>/dev/null || true
          git add App.tsx PROJECT-STATE.md
          git commit -m "fix: preserve collection identity and exact Back scroll"
          git pull --rebase origin main
          git push origin HEAD:main
