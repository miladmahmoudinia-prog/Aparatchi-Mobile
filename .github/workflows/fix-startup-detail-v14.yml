name: Fix startup truth and instant detail v14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-startup-detail-v14.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Patch startup and detail summary media only
        run: python3 .github/patch-startup-detail-v14.py

      - name: Verify exact regression scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app = Path('App.tsx').read_text(encoding='utf-8')
          service = Path('src/contentService.ts').read_text(encoding='utf-8')

          for value in (
              "const STARTUP_MIN_VISIBLE_MS = 5000;",
              "startupFallbackTimer = setTimeout(dismissStartup, 10000);",
              "const detailHistoryRef = useRef<CatalogItem[]>([]);",
              "const openNestedDetail = useCallback((nextItem: CatalogItem) => {",
              "if (state.selectedItem) { closeOrBackDetail(); return true; }",
              "onOpenRelated={openNestedDetail}",
              "const bootstrapContentPromise = loadBootstrapContent();",
              "freshContent.source === 'remote' && applyContent(freshContent)",
          ):
              assert value in app, value
          assert 'currentBootstrapApplied' not in app

          for value in (
              'const summaryDownloads = Array.isArray(item.downloads)',
              '? normalizeDownloads(item.downloads, iranian)',
              'const rawSummaryStreamUrl = asString(item.streamUrl);',
              '...(summaryDownloads.length ? { downloads: summaryDownloads } : {}),',
              "...(summaryStreamUrl ? { streamUrl: summaryStreamUrl, streamMode: 'video' as const } : {}),",
          ):
              assert value in service, value
          print('startup/detail static regressions: ok')
          PY
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(App.tsx src/contentService.ts)
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            echo "Unexpected modified files: ${changed[*]}" >&2
            exit 1
          fi
          git diff --check

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Commit only functional files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/contentService.ts
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(App.tsx src/contentService.ts)
          if [ "${staged[*]}" != "${expected[*]}" ]; then
            echo "Unexpected staged files: ${staged[*]}" >&2
            exit 1
          fi
          git commit -m "fix: reveal fresh catalog with instant detail actions [skip ci]"
          git push origin HEAD:main
