name: Home poster lifecycle v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-home-poster-lifecycle-v1.mjs'
      - '.github/workflows/home-poster-lifecycle-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-home-poster-lifecycle-v1
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply Home poster lifecycle repair
        run: node scripts/patch-home-poster-lifecycle-v1.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npm run typecheck

      - name: Verify poster lifecycle regression
        run: node --test scripts/tests/smooth-poster-loading.test.mjs

      - name: Verify Home performance budget
        run: node scripts/test-home-performance-pass.mjs

      - name: Commit verified Home poster repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx scripts/tests/smooth-poster-loading.test.mjs
          if git diff --cached --quiet; then
            echo "No Home poster lifecycle changes to commit."
            exit 0
          fi
          git commit -m "fix: keep Home poster rails mounted while scrolling"
          git pull --rebase origin main
          git push origin HEAD:main
