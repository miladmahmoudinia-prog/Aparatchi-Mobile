name: Record fast startup media v5 state
# State-only workflow. It never builds an APK.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/record-fast-startup-media-v5-state.mjs'
      - '.github/workflows/record-fast-startup-media-v5-state.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify functional Mobile commit is present
        run: git merge-base --is-ancestor 265545d9e41d3a702a6f9472ab931c1b55d91b02 HEAD

      - name: Record milestone
        run: node scripts/record-fast-startup-media-v5-state.mjs

      - name: Verify state markers
        run: |
          grep -F '265545d9e41d3a702a6f9472ab931c1b55d91b02' PROJECT-STATE.md
          grep -F 'af95c3f14a570fe1f9d5641b32d1e0b021d493ef' PROJECT-STATE.md
          grep -F '31905613920' PROJECT-STATE.md
          grep -F '31905568534' PROJECT-STATE.md

      - name: Commit state only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT-STATE.md
          if git diff --cached --quiet; then
            echo "State already recorded."
            exit 0
          fi
          git commit -m "docs: record startup media v5 milestone [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
