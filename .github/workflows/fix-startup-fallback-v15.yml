name: Fix current bootstrap startup fallback v15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-startup-fallback-v15.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Start from latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Patch only emergency startup fallback
        run: python3 .github/patch-startup-fallback-v15.py

      - name: Verify startup and navigation guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('App.tsx').read_text(encoding='utf-8')
          required = [
              'const STARTUP_MIN_VISIBLE_MS = 5000;',
              'const startupFallbackContentRef = useRef<LoadedContent | null>(null);',
              'loadBootstrapContent().then((bootstrapContent) => {',
              'startupFallbackContentRef.current = bootstrapContent;',
              'startupFallbackTimer = setTimeout(() => {',
              'const fallback = startupFallbackContentRef.current;',
              'setContent(visibleFallback);',
              '}, 10000);',
              'const detailHistoryRef = useRef<CatalogItem[]>([]);',
              'if (state.selectedItem) { closeOrBackDetail(); return true; }',
              'onOpenRelated={openNestedDetail}',
          ]
          for value in required:
              assert value in text, value
          assert 'startupFallbackTimer = setTimeout(dismissStartup, 10000);' not in text
          assert text.count('}, 10000);') >= 1
          print('current-bootstrap startup fallback guards: ok')
          PY
          if [ "$(git diff --name-only)" != "App.tsx" ]; then
            echo 'Unexpected modified file' >&2
            git diff --name-only >&2
            exit 1
          fi
          git diff --check

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Commit only App.tsx
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          if [ "$(git diff --cached --name-only)" != "App.tsx" ]; then
            echo 'Unexpected staged file' >&2
            exit 1
          fi
          git commit -m "fix: use current bootstrap for startup emergency fallback [skip ci]"
          git push origin HEAD:main
