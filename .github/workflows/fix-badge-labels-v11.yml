name: Fix badge labels v11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-badge-labels-v11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch only badge presentation
        shell: python
        run: |
          from pathlib import Path

          path = Path('App.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "badges.push({ id: 'language', label: 'دوبله', kind: 'language' });",
                  "badges.push({ id: 'language', label: 'دوبله فارسی', kind: 'language' });",
              ),
              (
                  "badge: language === 'dubbed' ? 'دوبله' : 'زیرنویس',",
                  "badge: language === 'dubbed' ? 'دوبله فارسی' : 'زیرنویس',",
              ),
              (
                  "{group.badge || (group.language === 'dubbed' ? 'دوبله' : group.language === 'subtitled' ? 'زیرنویس' : 'دریافت')}",
                  "{group.language === 'dubbed' ? 'دوبله فارسی' : group.badge || (group.language === 'subtitled' ? 'زیرنویس' : 'دریافت')}",
              ),
              (
                  "posterOperatorAccess: { backgroundColor: 'rgba(20,22,27,0.94)', borderWidth: 1, borderColor: 'rgba(216,180,90,0.82)' },",
                  "posterOperatorAccess: { backgroundColor: 'rgba(0,153,204,0.96)', borderWidth: 1, borderColor: 'rgba(116,231,255,0.96)' },",
              ),
              (
                  "posterOperatorAccessText: { color: COLORS.gold },",
                  "posterOperatorAccessText: { color: '#FFFFFF' },",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Verify exact UI changes
        shell: bash
        run: |
          set -euo pipefail
          grep -F "label: 'دوبله فارسی', kind: 'language'" App.tsx
          grep -F "badge: language === 'dubbed' ? 'دوبله فارسی' : 'زیرنویس'" App.tsx
          grep -F "group.language === 'dubbed' ? 'دوبله فارسی'" App.tsx
          grep -F "posterOperatorAccess: { backgroundColor: 'rgba(0,153,204,0.96)'" App.tsx
          grep -F "posterOperatorAccessText: { color: '#FFFFFF' }" App.tsx

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Commit only App.tsx
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git diff --cached --name-only
          if [ "$(git diff --cached --name-only)" != "App.tsx" ]; then
            echo "::error::Unexpected staged file"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No App.tsx changes to commit."
            exit 0
          fi
          git commit -m "fix: clarify dubbed and operator badges [skip ci]"
          git push origin HEAD:main
