name: Verify RTL media rails

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-rtl-media-rails.mjs'
      - 'scripts/test-rtl-media-rails.mjs'
      - '.github/workflows/verify-rtl-media-rails.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-source-fix
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply RTL media rails
        run: node scripts/apply-rtl-media-rails.mjs
      - name: Type-check application
        run: npm run typecheck
      - name: Run RTL rail regression
        run: node scripts/test-rtl-media-rails.mjs
      - name: Commit verified RTL rails
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-mobile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add App.tsx
          if git diff --cached --quiet; then
            echo "RTL media rails already applied."
            exit 0
          fi
          git commit -m "fix: start media rails from the right"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
