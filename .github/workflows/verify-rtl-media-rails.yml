name: Verify smooth right-start media rails

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-smooth-right-start-rails-v2.mjs'
      - 'scripts/test-smooth-right-start-rails-v1.mjs'
      - '.github/workflows/verify-rtl-media-rails.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-source-fix
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply native-scroll right-start rail repair
        run: node scripts/patch-smooth-right-start-rails-v2.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npm run typecheck

      - name: Verify horizontal rail gesture regression
        run: node scripts/test-smooth-right-start-rails-v1.mjs

      - name: Verify Home performance budget
        run: node scripts/test-home-performance-pass.mjs

      - name: Commit verified rail repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-mobile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add App.tsx
          if git diff --cached --quiet; then
            echo "Smooth right-start rails already applied."
            exit 0
          fi
          git commit -m "fix: keep media rails smooth while starting from right"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
