name: Apply reported mobile bugfixes

on:
  push:
    paths:
      - 'scripts/apply-reported-mobile-bugfixes.mjs'
      - 'scripts/verify-reported-mobile-bugfixes.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-reported-mobile-fixes
  cancel-in-progress: false

jobs:
  fix-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 30
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply reported root-cause fixes
        run: node scripts/apply-reported-mobile-bugfixes.mjs
      - name: Install dependencies
        run: npm install --include=dev
      - name: Type-check application
        run: npm run typecheck
      - name: Verify patched source invariants
        run: node scripts/verify-reported-mobile-bugfixes.mjs
      - name: Commit verified mobile source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx app.json package.json package-lock.json scripts/apply-reported-mobile-bugfixes.mjs scripts/verify-reported-mobile-bugfixes.mjs
          if git diff --cached --quiet; then
            echo "No source changes."
          else
            git commit -m "fix: RTL cast, episode artwork and player controls"
            PUSHED=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                PUSHED=1
                break
              fi
              git rebase --abort >/dev/null 2>&1 || true
              echo "Repository changed during push; retry ${attempt}/5"
              sleep $((attempt * 2))
            done
            if [ "$PUSHED" -ne 1 ]; then
              echo "::error::Could not publish verified mobile source after 5 attempts."
              exit 1
            fi
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android project
        run: npx expo prebuild --platform android --non-interactive
        env:
          NODE_ENV: production
      - name: Allow Gradle execution
        run: chmod +x android/gradlew
      - name: Build release APK
        run: cd android && ./gradlew app:assembleRelease
        env:
          NODE_ENV: production
      - name: Publish latest APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk Aparatchi-Android-Release.apk
          VERSION="$(node -p "require('./package.json').version")"
          TARGET="$(git rev-parse HEAD)"
          TITLE="Aparatchi Android v${VERSION}"
          NOTES="Latest reported fixes: RTL cast rail, exact episode artwork fallback, faster first launch, and a reorganized online player with lock, 10-second seek, volume/mute, settings and fullscreen controls."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --target "$TARGET" --title "$TITLE" --notes "$NOTES" --latest
            gh release upload android-latest Aparatchi-Android-Release.apk --clobber
          else
            gh release create android-latest Aparatchi-Android-Release.apk --target "$TARGET" --title "$TITLE" --notes "$NOTES" --latest
          fi
