name: Dispatch final APK v36 temp

on:
  issues:
    types: [opened, reopened]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: github.event.issue.title == 'RUN FINAL APK BUILD V36'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Dispatch Android APK workflow
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run android-apk.yml --ref main
          run_id=''
          for attempt in $(seq 1 40); do
            run_id="$(gh run list --workflow android-apk.yml --event workflow_dispatch --limit 20 --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$started_at\")][0].databaseId // empty")"
            [ -n "$run_id" ] && break
            sleep 4
          done
          if [ -z "$run_id" ]; then
            echo 'Could not locate Build Android APK run.' >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          set +e
          gh run watch "$run_id" --exit-status
          watch_status=$?
          set -e
          conclusion="$(gh run view "$run_id" --json conclusion --jq '.conclusion')"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          if [ "$watch_status" -ne 0 ] || [ "$conclusion" != 'success' ]; then
            exit 1
          fi
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
          CONCLUSION: ${{ steps.build.outputs.conclusion }}
        run: gh issue comment "$ISSUE_NUMBER" --body "apk_run=${RUN_ID:-unknown}\napk=${CONCLUSION:-not-completed}\nrelease=android-latest"
