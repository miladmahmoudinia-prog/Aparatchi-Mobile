name: Record Content Sync Kids v24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-project-state-v24.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Update project state
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('PROJECT-STATE.md')
          text = p.read_text()
          text = text.replace(
              '- sync ساعتی و completion قدیمی ادامه داشته باشد؛ window محدود نباید جلوی تکمیل catalog را بگیرد.',
              '- Sync Upera طبق تصمیم فعلی هر دو ساعت یک‌بار اجرا شود؛ completion قدیمی ادامه داشته باشد و window محدود نباید جلوی تکمیل catalog را بگیرد.'
          )
          milestone = '''

---

# milestone Content Sync + Kids v24 — 2026-08-18
- گزارش دستگاه/Actions نشان داد `Sync Upera Catalog` قرمز است و دسته «کودکان» فقط «هشتگ خاله سوسکه» را نشان می‌دهد.
- ریشهٔ قرمزشدن Sync خود Upera/توکن نبود: preflight قبل از Sync روی ۶ assertion منسوخ Bootstrap شکست می‌خورد؛ آن تست‌ها هنوز Bootstrap قدیمی Home-only را انتظار داشتند، در حالی که معماری فعلی Bootstrap کامل Navigation را عمداً حفظ می‌کند.
- Content functional commit `8881842d658b73d924a03dc1a1139d00c5c0f5ad` تست‌های Bootstrap را با معماری کامل Navigation همگام کرد بدون اینکه catalog یا media برای پاس شدن تست کوچک/حذف شود.
- classifier Kids فقط هویت صریح محتوای کودکانه را می‌پذیرد؛ فیلم عادی/خانوادگی صرفاً به‌خاطر Family/کودک در داستان وارد Kids نمی‌شود. محتوای صریح مثل خاله نسرین، خاله سوسکه، عمو پورنگ، ترانه/سرود/قصه/برنامه کودک می‌تواند Kids باشد حتی اگر متادیتای قدیمی آن را Animation علامت زده باشد.
- ۵ عنوان واقعی خاله نسرین که داخل catalog و دارای media بودند ولی به Animation افتاده بودند به Kids برگشتند؛ Kids تأییدشده اکنون ۶ عنوان است: ۵ خاله نسرین + «هشتگ خاله سوسکه».
- validation run `32138359368` کل suite Content را `120/120` سبز کرد و cron دقیق `34 */2 * * *` را تأیید کرد؛ cadence دو ساعته عمداً حفظ شد.
- بعد از merge، یک probe واقعی bounded با `UPERA_SYNC_MODE=NORMAL` و Secretهای اصلی repo نیز preflight + مسیر واقعی Upera را با موفقیت طی کرد و guard عدم کوچک‌شدن catalog را پاس کرد. workflow/marker موقت verification پس از موفقیت از Content main حذف شدند.
- Content HEAD بعد از cleanup verification: `bcf6ba65fe5095888a903a188d27d5b39363f018`؛ workflowهای دائمی Content فقط `backfill-missing-people.yml`, `enrich-tmdb-cast.yml`, `startup-bootstrap-v17.yml`, `sync-upera.yml` هستند.
'''
          if '# milestone Content Sync + Kids v24 — 2026-08-18' not in text:
              text = text.rstrip() + milestone + '\n'
          p.write_text(text)
          PY
      - name: Commit state and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-project-state-v24.yml
          git add -A
          git commit -m "docs: record Content sync and Kids v24"
          git push origin HEAD:main
