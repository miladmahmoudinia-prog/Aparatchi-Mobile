name: Final user batch v19

on:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-final-v19
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.issue.title == 'RUN FINAL USER BATCH V19'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current Mobile main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 80

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply direct App repair
        run: node scripts/fix-final-user-batch-v19.mjs

      - name: Remove temporary global FlatList monkeypatch
        shell: bash
        run: |
          cat > index.ts <<'EOF'
          import { registerRootComponent } from 'expo';

          import App from './App';

          registerRootComponent(App);
          EOF
          git rm -f --ignore-unmatch src/collectionFlatListGuard.tsx

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Type-check
        run: npm run typecheck

      - name: Run existing Mobile regressions
        run: node --test scripts/tests/*.test.mjs

      - name: Audit requested behavior
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const posterNameFa = String(item.nameFa || item.name || '').trim();" App.tsx
          grep -F "let collectionBrowserScrollOffset = 0;" App.tsx
          grep -F "contentOffset={{ x: 0, y: collectionBrowserScrollOffset }}" App.tsx
          grep -F "onScroll={rememberCollectionBrowserOffset}" App.tsx
          grep -F "const relatedBadges = itemPosterBadges(relatedItem);" App.tsx
          grep -F "badge.kind === 'operator' && styles.posterOperatorAccess" App.tsx
          grep -F "const titleFa = rawFa && hasPersianScript(rawFa)" App.tsx
          ! grep -F ': `مجموعه ${firstFa' App.tsx
          ! grep -F "[A-Za-z]/.test(item.nameFa || '') && item.collectionNameFa" App.tsx
          grep -F "import App from './App';" index.ts
          test ! -f src/collectionFlatListGuard.tsx

      - name: Commit verified Mobile repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat >> PROJECT-STATE.md <<'EOF'

# milestone Final collection + related badges v19 — 2026-08-18
- Poster cards now always use the work's own title; collection identity is never substituted for a movie/series title.
- Collection folders/detail headers use collection metadata only; missing Persian collection metadata falls back to the original collection name instead of borrowing the first installment.
- Collection folder list remembers exact pixel scroll position and restores it after both header Back and Android hardware Back.
- Related-title cards now reuse the same truthful poster badges as normal cards: dubbed, subtitled, and mobile-operator badges appear only when item metadata proves them.
- The temporary global FlatList monkeypatch was removed; these fixes live directly in App.tsx.
- Startup/cold-start logic was audited but not rewritten in this batch.
- TypeScript + existing Mobile regression tests were required to pass before commit. No APK was built.
EOF

          git rm -f scripts/fix-final-user-batch-v19.mjs .github/workflows/final-user-batch-v19.yml
          git add App.tsx index.ts PROJECT-STATE.md
          git commit -m "fix: finalize collection identity scroll and related badges"
          git pull --rebase origin main
          git push origin HEAD:main
