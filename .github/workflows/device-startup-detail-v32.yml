name: One-shot first-install freshness v33

on:
  pull_request:
    branches: [main]
    paths:
      - 'first-install-v33-trigger.txt'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: first-install-v33-${{ github.event.pull_request.number }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 20

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Normalize and validate repair script
        run: |
          node scripts/fix-v33-script-syntax.mjs
          node --check scripts/apply-first-install-freshness-v33.mjs

      - name: Apply missed startup/detail repair
        shell: bash
        run: |
          if grep -q "const bootstrapIds = new Set" App.tsx \
            && grep -q "const visiblePoster = current.poster" App.tsx \
            && grep -q "payloadClientRevision !== manifest.clientRevision" src/contentService.ts; then
            echo "startup/detail repair already persisted"
          else
            node scripts/apply-device-startup-detail-v32.mjs
          fi

      - name: Apply first-install freshness repair
        shell: bash
        run: |
          if grep -q "const STARTUP_MIN_VISIBLE_MS = 0;" App.tsx \
            && grep -q "const rawPromise = firstValidManifest(rawCandidates);" src/contentService.ts \
            && grep -q "const controllers = candidates.map" src/contentService.ts; then
            echo "first-install freshness repair already persisted"
          else
            node scripts/apply-first-install-freshness-v33.mjs
          fi

      - name: Normalize generated regressions
        run: |
          node scripts/fix-v33-generated-tests.mjs
          node --check scripts/tests/first-install-freshness-v33.test.mjs
          node --check scripts/tests/device-startup-detail-stability-v32.test.mjs
          node --check scripts/test-truthful-startup-cache-v6.mjs
          node --check scripts/test-visible-media-startup-v7.mjs

      - name: Persist generated source repair before regressions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/contentService.ts scripts/test-truthful-startup-cache-v6.mjs scripts/test-visible-media-startup-v7.mjs scripts/tests/device-startup-detail-stability-v32.test.mjs scripts/tests/first-install-freshness-v33.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "fix: persist generated first-install startup repair"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck-v33.log 2>&1
          status=$?
          cat typecheck-v33.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add typecheck-v33.log
            git commit -m "chore: capture v33 typecheck diagnostics" || true
            git push origin HEAD:${{ github.head_ref }} || true
            exit "$status"
          fi
          rm -f typecheck-v33.log

      - name: First-install regression
        run: node --test scripts/tests/first-install-freshness-v33.test.mjs

      - name: Device startup/detail regression
        run: node --test scripts/tests/device-startup-detail-stability-v32.test.mjs

      - name: Existing startup regressions
        shell: bash
        run: |
          node scripts/test-truthful-startup-cache-v6.mjs
          node scripts/test-visible-media-startup-v7.mjs

      - name: Commit verified source repair to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/device-startup-detail-v32.yml scripts/apply-device-startup-detail-v32.mjs scripts/apply-first-install-freshness-v33.mjs scripts/fix-v33-script-syntax.mjs scripts/fix-v33-generated-tests.mjs device-startup-detail-v32-run.txt first-install-v33-trigger.txt typecheck-v33.log
          git add App.tsx src/contentService.ts scripts/test-truthful-startup-cache-v6.mjs scripts/test-visible-media-startup-v7.mjs scripts/tests/device-startup-detail-stability-v32.test.mjs scripts/tests/first-install-freshness-v33.test.mjs
          git commit -m "fix: make first install reveal current Home immediately"
          git push origin HEAD:${{ github.head_ref }}
