name: Use in-app browser for operator playback

on:
  push:
    branches: [main]
    paths:
      - 'scripts/use-in-app-browser-for-operator.mjs'
      - 'scripts/test-operator-in-app-browser.mjs'
      - '.github/workflows/use-in-app-browser-for-operator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-source-fix
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 20
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install Expo WebBrowser
        env:
          CI: '1'
        run: npx expo install expo-web-browser
      - name: Apply operator browser patch
        run: node scripts/use-in-app-browser-for-operator.mjs
      - name: Type-check application
        run: npm run typecheck
      - name: Run operator browser regression
        run: node scripts/test-operator-in-app-browser.mjs
      - name: Commit verified operator browser
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-mobile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add App.tsx package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Operator in-app browser already applied."
            exit 0
          fi
          git commit -m "fix: open operator playback in an in-app browser"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
