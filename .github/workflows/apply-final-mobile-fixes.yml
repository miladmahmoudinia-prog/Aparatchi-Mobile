name: Apply final mobile fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-final-mobile-fixes.mjs'
      - '.github/workflows/apply-final-mobile-fixes.yml'

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-source-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply final Mobile fixes
        shell: bash
        run: |
          set +e
          : > final-mobile-fix-output.log
          node scripts/apply-final-mobile-fixes.mjs >> final-mobile-fix-output.log 2>&1
          patch_code=$?
          cat final-mobile-fix-output.log
          if [ "$patch_code" -ne 0 ]; then
            git restore App.tsx src/types.ts src/contentService.ts 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add final-mobile-fix-output.log
            git commit -m "diagnostic: Mobile final fixer patch failure" || true
            git pull --rebase --autostash origin main
            git push origin HEAD:main
            exit "$patch_code"
          fi
          rm -f final-mobile-fix-output.log

      - name: Install dependencies
        run: npm ci

      - name: Validate and capture Mobile typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > final-mobile-fix-output.log 2>&1
          code=$?
          cat final-mobile-fix-output.log
          if [ "$code" -ne 0 ]; then
            cp App.tsx patched-App-diagnostic.txt
            git restore App.tsx src/types.ts src/contentService.ts 2>/dev/null || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add final-mobile-fix-output.log patched-App-diagnostic.txt
            git commit -m "diagnostic: Mobile final fixer typecheck failure" || true
            git pull --rebase --autostash origin main
            git push origin HEAD:main
            exit "$code"
          fi
          rm -f final-mobile-fix-output.log patched-App-diagnostic.txt

      - name: Commit fixed sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/types.ts src/contentService.ts
          git add -A final-mobile-fix-output.log patched-App-diagnostic.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No mobile source changes were needed."
            exit 0
          fi
          git commit -m "fix: restore media labels people works categories and navigation"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
