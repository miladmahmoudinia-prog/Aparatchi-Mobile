name: Apply final mobile fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-final-mobile-fixes.mjs'

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-source-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply source fixes
        run: node scripts/apply-final-mobile-fixes.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type-check final sources
        run: npm run typecheck

      - name: Commit fixed sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/types.ts src/contentService.ts
          if git diff --cached --quiet; then
            echo "No mobile source changes were needed."
            exit 0
          fi
          git commit -m "fix: restore media labels people works categories and navigation"
          git pull --rebase origin main
          git push origin HEAD:main
