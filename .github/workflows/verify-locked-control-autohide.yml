name: Verify locked control autohide

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-locked-control-autohide-fix.mjs
      - .github/workflows/verify-locked-control-autohide.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-locked-control-autohide
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Apply locked control autohide repair
        run: node scripts/apply-locked-control-autohide-fix.mjs

      - name: Type-check application
        run: npm run typecheck

      - name: Run locked control regression
        run: node --test scripts/tests/locked-control-autohide.test.mjs

      - name: Commit verified locked control fix
        run: |
          git config user.name "aparatchi-mobile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add App.tsx app.json package.json scripts/tests/locked-control-autohide.test.mjs
          if git diff --cached --quiet; then
            echo "No locked-control changes to commit."
            exit 0
          fi
          git commit -m "fix: auto-hide unlock control with player chrome"
          git push origin HEAD:main
