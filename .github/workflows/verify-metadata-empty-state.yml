name: Verify metadata empty states

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-metadata-empty-state-fix.mjs
      - .github/workflows/verify-metadata-empty-state.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-metadata-empty-state
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Apply metadata empty-state repair
        run: node scripts/apply-metadata-empty-state-fix.mjs

      - name: Type-check application
        run: npm run typecheck

      - name: Run metadata empty-state regression
        run: node --test scripts/tests/metadata-empty-state.test.mjs

      - name: Commit verified metadata empty-state fix
        run: |
          git config user.name "aparatchi-mobile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add App.tsx app.json package.json scripts/tests/metadata-empty-state.test.mjs
          if git diff --cached --quiet; then
            echo "No metadata empty-state changes to commit."
            exit 0
          fi
          git commit -m "fix: keep missing metadata sections visible"
          git push origin HEAD:main
