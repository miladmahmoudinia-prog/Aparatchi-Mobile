name: Record Home first frame v4 state
# Documentation-only workflow. Never builds an APK.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/record-home-first-frame-v4-state.mjs'
      - '.github/workflows/record-home-first-frame-v4-state.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-record-home-first-frame-v4
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify functional Home commit is present
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fad7c57d6d3de22817c2ce4f6581a54cd44eb98b HEAD
          grep -F "catalog-bootstrap.json" src/config.ts
          grep -F "const populatedRows = useMemo" App.tsx

      - name: Record milestone
        run: node scripts/record-home-first-frame-v4-state.mjs

      - name: Verify state markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F "fad7c57d6d3de22817c2ce4f6581a54cd44eb98b" PROJECT-STATE.md
          grep -F "31903599514" PROJECT-STATE.md
          grep -F "5a243b352af80e52d4c6ada749fe9e9fa9bdc31f" PROJECT-STATE.md
          grep -F "404486" PROJECT-STATE.md

      - name: Commit state only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT-STATE.md
          if git diff --cached --quiet; then
            echo "State already current."
            exit 0
          fi
          git commit -m "docs: record Home first-frame v4 milestone [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
