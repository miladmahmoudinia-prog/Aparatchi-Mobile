name: Fix runtime latency v3
# Verification-only workflow; it never builds or publishes an APK.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-runtime-latency-v3.mjs'
      - 'scripts/test-runtime-latency-v3.mjs'
      - '.github/workflows/fix-runtime-latency-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-runtime-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply runtime latency repair
        run: node scripts/fix-runtime-latency-v3.mjs

      - name: Inspect patched source around syntax-sensitive blocks
        shell: bash
        run: |
          nl -ba App.tsx | sed -n '5360,5465p'
          nl -ba App.tsx | sed -n '5630,5755p'

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npm run typecheck

      - name: Verify reported runtime regressions
        run: node scripts/test-runtime-latency-v3.mjs

      - name: Verify Home/detail regression
        run: node scripts/test-home-detail-render-v2.mjs

      - name: Verify Home performance
        run: node scripts/test-home-performance-pass.mjs

      - name: Verify operator playback
        run: node scripts/test-operator-in-app-browser.mjs

      - name: Verify metadata empty state
        run: node --test scripts/tests/metadata-empty-state.test.mjs

      - name: Verify startup projectionist and timing
        run: node scripts/test-startup-projectionist.mjs

      - name: Verify poster stability
        run: node --test scripts/tests/smooth-poster-loading.test.mjs

      - name: Verify RTL media rails
        run: node scripts/test-rtl-media-rails.mjs

      - name: Verify neutral foreign media
        run: node scripts/test-neutral-foreign-media-ui.mjs

      - name: Verify movie end recommendations
        run: node scripts/test-movie-end-recommendations.mjs

      - name: Verify next episode overlay
        run: node scripts/test-series-next-episode-overlay.mjs

      - name: Verify detail related titles
        run: node scripts/test-detail-related-titles.mjs

      - name: Verify locked controls auto-hide
        run: node --test scripts/tests/locked-control-autohide.test.mjs

      - name: Verify episode artwork performance
        run: node --test scripts/tests/exact-device-episode-thumbnails.test.mjs

      - name: Commit only after every verification is green
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx src/contentService.ts
          if git diff --cached --quiet; then
            echo "Verified runtime repair is already applied."
            exit 0
          fi
          git commit -m "fix: speed episode and detail interactions [skip ci]"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
