name: Performance critical paths v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-performance-critical-paths-v2.mjs'
      - '.github/workflows/performance-critical-paths-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-performance-critical-v2
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Patch critical interaction paths
        run: node scripts/patch-performance-critical-paths-v2.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npm run typecheck

      - name: Verify critical Home performance
        run: node scripts/test-home-performance-pass.mjs

      - name: Verify poster loading regression
        run: node --test scripts/tests/smooth-poster-loading.test.mjs

      - name: Verify RTL media rails regression
        run: node scripts/test-rtl-media-rails.mjs

      - name: Verify metadata empty state regression
        run: node --test scripts/tests/metadata-empty-state.test.mjs

      - name: Commit verified performance patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- App.tsx; then
            echo "No App.tsx changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "perf: unblock critical app interactions"
          git pull --rebase origin main
          git push origin HEAD:main
