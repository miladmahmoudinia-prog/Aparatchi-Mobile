name: One-shot detail stability v34

on:
  pull_request:
    branches: [main]
    paths:
      - 'detail-stability-v34-trigger.txt'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: detail-stability-v34-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 20

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Apply Detail first-paint repair
        run: node scripts/apply-detail-stability-v34.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Detail first-paint regression
        run: node --test scripts/tests/detail-first-paint-stability-v34.test.mjs

      - name: Existing startup/detail regressions
        shell: bash
        run: |
          node --test scripts/tests/device-startup-detail-stability-v32.test.mjs
          node --test scripts/tests/first-install-freshness-v33.test.mjs
          node scripts/test-truthful-startup-cache-v6.mjs
          node scripts/test-visible-media-startup-v7.mjs

      - name: Commit verified Mobile repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/detail-stability-v34.yml scripts/apply-detail-stability-v34.mjs detail-stability-v34-trigger.txt
          git add App.tsx scripts/tests/detail-first-paint-stability-v34.test.mjs
          git commit -m "fix: keep Detail first paint stable during enrichment"
          git push origin HEAD:${{ github.head_ref }}