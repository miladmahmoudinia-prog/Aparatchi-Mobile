name: IMDb title fallback v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-imdb-title-fallback-v1.mjs'
      - '.github/workflows/imdb-title-fallback-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-source-fix
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply IMDb title fallback repair
        run: node scripts/patch-imdb-title-fallback-v1.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npm run typecheck

      - name: Verify original-title fallback regression
        run: node scripts/test-imdb-title-fallback-v1.mjs

      - name: Commit verified IMDb title fallback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-mobile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add App.tsx scripts/test-imdb-title-fallback-v1.mjs
          if git diff --cached --quiet; then
            echo "IMDb title fallback already applied."
            exit 0
          fi
          git commit -m "fix: keep unknown IMDb titles in original English"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
