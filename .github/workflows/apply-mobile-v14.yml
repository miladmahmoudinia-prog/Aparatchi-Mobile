name: Validate current Aparatchi mobile fixes v16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-v14.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-user-report-v16
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current Mobile main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Expose validation run id
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-mobile-bot"
          git config user.email "actions@users.noreply.github.com"
          printf 'run_id=%s\nhead_sha=%s\nstarted_at=%s\n' "${{ github.run_id }}" "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > mobile-v16-validation-run.txt
          git add mobile-v16-validation-run.txt
          git commit -m 'chore: expose mobile v16 validation run [skip ci]'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Verify reported behavior guards
        run: |
          node scripts/verify-user-report-v12.mjs
          node scripts/verify-user-report-v13.mjs

      - name: Install dependencies
        run: timeout 480s npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check application
        run: timeout 240s npm run typecheck
