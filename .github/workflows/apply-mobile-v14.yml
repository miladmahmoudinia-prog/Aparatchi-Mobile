name: Apply Aparatchi mobile fixes v16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-v14.yml'
      - 'mobile-v16-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-user-report-v16
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current Mobile main
        uses: actions/checkout@v6
        with:
          fetch-depth: 40

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply and statically verify reported fixes
        shell: bash
        run: |
          set -euo pipefail
          : > mobile-v16-status.log
          {
            python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-user-report-v12.mjs')
          text = path.read_text()
          old = "  1,\n  'detail firstSeenAt normalization',"
          new = "  2,\n  'detail firstSeenAt normalization',"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('v12 helper guard not found')
          PY
            node scripts/apply-user-report-v12.mjs
            node scripts/apply-user-report-v13.mjs
            node scripts/verify-user-report-v12.mjs
            node scripts/verify-user-report-v13.mjs
          } 2>&1 | tee -a mobile-v16-status.log

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          timeout 480s npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee -a mobile-v16-status.log

      - name: Type-check application
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s npm run typecheck 2>&1 | tee -a mobile-v16-status.log

      - name: Commit verified Mobile source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aparatchi-mobile-bot"
          git config user.email "actions@users.noreply.github.com"
          printf '\nFINAL_STATUS=0\n' >> mobile-v16-status.log
          git add App.tsx src/contentService.ts src/types.ts mobile-v16-status.log
          if git diff --cached --quiet; then
            echo 'No Mobile source changes were needed.'
            exit 0
          fi
          git commit -m 'fix: apply verified startup detail navigation ordering and regional fixes v16 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Save failure diagnostic
        if: failure()
        shell: bash
        run: |
          set +e
          printf '\nFINAL_STATUS=1\n' >> mobile-v16-status.log
          git config user.name "aparatchi-mobile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile-v16-status.log
          if ! git diff --cached --quiet; then
            git commit -m 'chore: capture mobile v16 repair failure [skip ci]'
            git pull --rebase origin main && git push origin HEAD:main
          fi
