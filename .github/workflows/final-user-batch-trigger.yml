name: Final mobile fixes trigger

on:
  push:
    branches: [main]
    paths:
      - 'scripts/final-user-batch-trigger-20260814.txt'
      - 'scripts/apply-exact-device-episode-thumbnails.mjs'
      - '.github/workflows/final-user-batch-trigger.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-source-fix
  cancel-in-progress: false

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Apply final UI and media fixes
        run: |
          node scripts/apply-final-user-batch-20260814-retry.mjs
          node scripts/apply-exact-device-episode-thumbnails.mjs
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Run all regression locks
        run: node --test scripts/tests/*.test.mjs
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx package.json app.json scripts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: final UI media performance and exact episode covers"
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          [ "$PUSHED" -eq 1 ] || exit 1
