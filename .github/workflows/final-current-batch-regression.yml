name: Final current batch regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-current-batch-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aparatchi-mobile-final-current-batch
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check application
        run: npm run typecheck
      - name: Verify operator playback
        run: node scripts/test-operator-in-app-browser.mjs
      - name: Verify metadata empty state
        run: node --test scripts/tests/metadata-empty-state.test.mjs
      - name: Verify startup projectionist and timing
        run: node scripts/test-startup-projectionist.mjs
      - name: Verify poster stability
        run: node --test scripts/tests/smooth-poster-loading.test.mjs
      - name: Verify RTL media rails
        run: node scripts/test-rtl-media-rails.mjs
      - name: Verify Home performance
        run: node scripts/test-home-performance-pass.mjs
      - name: Verify neutral foreign media
        run: node scripts/test-neutral-foreign-media-ui.mjs
      - name: Verify movie end recommendations
        run: node scripts/test-movie-end-recommendations.mjs
      - name: Verify next episode overlay
        run: node scripts/test-series-next-episode-overlay.mjs
      - name: Verify detail related titles
        run: node scripts/test-detail-related-titles.mjs
      - name: Verify locked controls auto-hide
        run: node --test scripts/tests/locked-control-autohide.test.mjs
      - name: Verify exact episode thumbnails
        run: node --test scripts/tests/exact-device-episode-thumbnails.test.mjs

# rerun marker: aligned metadata regression with RTL rail
