name: Apply related shortfilm v38 temp

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == 'RUN RELATED SHORTFILM V38'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Normalize patch generator
        run: node scripts/fix-related-patch-v38.mjs
      - name: Apply patch
        run: node scripts/apply-related-shortfilm-v38.mjs
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Typecheck
        run: npm run typecheck
      - name: Regression suite
        run: node --test scripts/tests/*.test.mjs
      - name: Persist verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore scripts/apply-related-shortfilm-v38.mjs
          git add App.tsx scripts/tests/related-shortfilm-v38.test.mjs
          if git diff --cached --quiet; then
            echo "No source changes."
          else
            git commit -m "fix: diversify related titles and add short films v38"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh issue comment ${{ github.event.issue.number }} --body "related-shortfilm-v38=success\nhead=$(git rev-parse HEAD)"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh issue comment ${{ github.event.issue.number }} --body "related-shortfilm-v38=failure\nrun=${{ github.run_id }}\nhead=$(git rev-parse HEAD)"