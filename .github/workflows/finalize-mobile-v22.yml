name: Finalize Mobile v22

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: aparatchi-mobile-finalize-v22
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.issue.title == 'RUN FINALIZE MOBILE V22'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 100

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Materialize Metro App patches
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node <<'NODE' 2>&1 | tee /tmp/finalize-patch.log
          const fs = require('node:fs');
          const { applyMobileSourcePatches } = require('./scripts/mobile-source-patches.cjs');
          const file = 'App.tsx';
          const before = fs.readFileSync(file, 'utf8');
          const after = applyMobileSourcePatches(before, file);
          if (!after || after === before) throw new Error('No App patches were materialized; unknown source state.');
          fs.writeFileSync(file, after, 'utf8');
          console.log(`materialized delta=${after.length - before.length}`);
          NODE

      - name: Install dependencies
        id: install
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci --include=dev 2>&1 | tee /tmp/finalize-install.log

      - name: Type-check final direct App source
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/finalize-typecheck.log

      - name: Run existing Mobile regressions
        id: regressions
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test scripts/tests/*.test.mjs 2>&1 | tee /tmp/finalize-regressions.log

      - name: Audit every reported final behavior
        id: audit
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            grep -F "const posterNameFa = String(item.nameFa || item.name || '').trim();" App.tsx
            grep -F "let collectionBrowserScrollOffset = 0;" App.tsx
            grep -F "contentOffset={{ x: 0, y: collectionBrowserScrollOffset }}" App.tsx
            grep -F "onScroll={rememberCollectionBrowserOffset}" App.tsx
            grep -F "const relatedBadges = itemPosterBadges(relatedItem);" App.tsx
            grep -F "badge.kind === 'operator' && styles.posterOperatorAccess" App.tsx
            grep -F "? (item.latestEpisode || newestEpisodeGroup(item))" App.tsx
            grep -A12 -F "style={styles.homeScroll}" App.tsx | grep -F "removeClippedSubviews"
            ! grep -A12 -F "style={styles.homeScroll}" App.tsx | grep -F "removeClippedSubviews={false}"
            grep -F "removeClippedSubviews={false}" App.tsx
            grep -F "installStartupContentGate" index.ts
            ! grep -F "installCollectionFlatListGuard" index.ts
            test -f src/startupContentGate.ts
            test ! -f src/collectionFlatListGuard.tsx
            git diff --check
          } 2>&1 | tee /tmp/finalize-audit.log

      - name: Finalize green state or commit diagnostic
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          REGRESSIONS_OUTCOME: ${{ steps.regressions.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$PATCH_OUTCOME" == success && "$INSTALL_OUTCOME" == success && "$TYPECHECK_OUTCOME" == success && "$REGRESSIONS_OUTCOME" == success && "$AUDIT_OUTCOME" == success ]]; then
            cat >> PROJECT-STATE.md <<'EOF'

# milestone Final reported Mobile batch v22 — 2026-08-18
- The final title/collection identity, collection Back scroll restore, related availability badges and Home scroll-performance patches now live directly in App.tsx.
- Related cards show dubbed, Persian-subtitle and verified mobile-operator badges only when item metadata proves them.
- Collection browser restores the exact vertical pixel offset after header Back and Android hardware Back.
- Cold-start startupContentGate remains installed before App loads, preventing the full catalog from competing with the compact bootstrap during first paint.
- Home vertical rendering uses smaller batches/native clipping while horizontal RTL rails keep their proven unclipped behavior; series cards prefer precomputed latestEpisode metadata.
- Temporary Metro source patching and all v19/v20/v21 one-shot repair workflows/scripts were removed after TypeScript + regression tests passed.
- No APK was built in this milestone.
EOF
            git rm -f --ignore-unmatch \
              FINALIZE-MOBILE-V22-DIAGNOSTIC.md \
              scripts/fix-final-user-batch-v19.mjs \
              scripts/fix-home-scroll-performance-v20.mjs \
              scripts/fix-final-device-batch-v21.mjs \
              scripts/mobile-source-patches.cjs \
              scripts/metro-app-patch-transformer.cjs \
              scripts/final-device-pr-trigger.txt \
              metro.config.js \
              .github/workflows/final-user-batch-v19.yml \
              .github/workflows/home-scroll-performance-v20.yml \
              .github/workflows/final-device-batch-v21.yml \
              .github/workflows/issue-final-device-v21.yml \
              .github/workflows/pr-final-device-v21.yml \
              .github/workflows/finalize-mobile-v22.yml
            git add -A
            git diff --check
            git commit -m "fix: finalize reported Mobile batch v22 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            exit 0
          fi

          {
            echo '# Finalize Mobile v22 diagnostic'
            echo
            echo "- patch: $PATCH_OUTCOME"
            echo "- install: $INSTALL_OUTCOME"
            echo "- typecheck: $TYPECHECK_OUTCOME"
            echo "- regressions: $REGRESSIONS_OUTCOME"
            echo "- audit: $AUDIT_OUTCOME"
            for log in /tmp/finalize-patch.log /tmp/finalize-install.log /tmp/finalize-typecheck.log /tmp/finalize-regressions.log /tmp/finalize-audit.log; do
              if [[ -f "$log" ]]; then
                echo
                echo "## $(basename "$log")"
                echo '```text'
                tail -n 120 "$log"
                echo '```'
              fi
            done
          } > FINALIZE-MOBILE-V22-DIAGNOSTIC.md

          git checkout -- App.tsx || true
          git add FINALIZE-MOBILE-V22-DIAGNOSTIC.md
          git commit -m "chore: record Mobile v22 finalization diagnostic [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          exit 1
