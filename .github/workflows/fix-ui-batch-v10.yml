name: Fix fast detail and episode UI v10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ui-batch-v10.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aparatchi-mobile-write-lock
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused UI fix
        run: node scripts/fix-ui-batch-v10.mjs
      - name: Run v10 regression
        run: node scripts/test-ui-batch-v10.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Run relevant existing regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            scripts/test-truthful-startup-cache-v6.mjs \
            scripts/test-detail-performance-v4.mjs \
            scripts/test-fast-startup-media-v5.mjs \
            scripts/test-neutral-media-conflict-v5.mjs; do
            if [ -f "$f" ]; then node "$f"; fi
          done
      - name: Commit functional files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx scripts/fix-ui-batch-v10.mjs scripts/test-ui-batch-v10.mjs .github/workflows/fix-ui-batch-v10.yml
          if git diff --cached --quiet; then
            echo "Already current."
            exit 0
          fi
          git commit -m "fix: make detail actions and episode labels immediate [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      # v10 rerun 4: verified assertion shape
