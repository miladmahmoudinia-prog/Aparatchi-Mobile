name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --include=dev

      - name: Type-check application
        run: npm run typecheck

      - name: Resolve application version
        id: app_version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Android project
        run: npx expo prebuild --platform android --non-interactive
        env:
          NODE_ENV: production

      - name: Allow Gradle execution
        run: chmod +x android/gradlew

      - name: Build release APK
        run: cd android && ./gradlew app:assembleRelease
        env:
          NODE_ENV: production

      - name: Prepare APK for release
        run: cp android/app/build/outputs/apk/release/app-release.apk Aparatchi-Android-Release.apk

      # Releases does not consume the 0.5 GB Actions artifact quota.
      - name: Publish APK to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.app_version.outputs.version }}
          RELEASE_TAG: android-latest
          APK_PATH: Aparatchi-Android-Release.apk
        run: |
          set -euo pipefail

          RELEASE_TITLE="Aparatchi Android v${APP_VERSION}"
          RELEASE_NOTES="Latest Android APK for Aparatchi v${APP_VERSION}."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --latest
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi
