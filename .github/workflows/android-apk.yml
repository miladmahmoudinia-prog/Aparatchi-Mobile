name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    env:
      EXPO_NO_TELEMETRY: "1"
      ANDROID_HOME: C:/actions-runner/android-sdk
      ANDROID_SDK_ROOT: C:/actions-runner/android-sdk
      JAVA_HOME: C:/actions-runner/_work/_tool/Java_Temurin-Hotspot_jdk/17.0.20-8/x64

    steps:
      # Do not use actions/checkout on this self-hosted runner. codeload.github.com
      # repeatedly rate-limited action ZIP downloads with HTTP 429. Git itself is
      # already installed on the machine, so sync the requested commit directly.
      - name: Sync project with local Git
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if not exist ".git" git init .
          git config core.longpaths true
          git fetch --force --no-tags --prune --depth=1 "https://x-access-token:%GH_TOKEN%@github.com/%GITHUB_REPOSITORY%.git" "%GITHUB_SHA%" || git fetch --force --no-tags --prune --depth=20 "https://x-access-token:%GH_TOKEN%@github.com/%GITHUB_REPOSITORY%.git" "%GITHUB_REF_NAME%"
          git reset --hard %GITHUB_SHA% || git reset --hard FETCH_HEAD
          git clean -ffdx

      # Reuse software already present on the PC/tool cache. This removes the
      # actions/setup-node and actions/setup-java downloads completely.
      - name: Activate local toolchain
        shell: cmd
        run: |
          if exist "C:\Program Files\nodejs\node.exe" echo C:\Program Files\nodejs>>"%GITHUB_PATH%"
          for /d %%D in ("C:\actions-runner\_work\_tool\node\22.*") do if exist "%%~fD\x64\node.exe" echo %%~fD\x64>>"%GITHUB_PATH%"
          if exist "%JAVA_HOME%\bin\java.exe" echo %JAVA_HOME%\bin>>"%GITHUB_PATH%"

      - name: Verify local build tools
        shell: cmd
        run: |
          where git || exit /b 1
          git --version || exit /b 1
          where node || exit /b 1
          node --version || exit /b 1
          where npm || exit /b 1
          npm --version || exit /b 1
          if not exist "%JAVA_HOME%\bin\java.exe" (echo Java 17 not found at %JAVA_HOME% & exit /b 1)
          "%JAVA_HOME%\bin\java.exe" -version || exit /b 1
          if not exist "%ANDROID_HOME%" (echo Android SDK folder not found: %ANDROID_HOME% & exit /b 1)
          echo Using Android SDK: %ANDROID_HOME%
          if exist "%ANDROID_HOME%\licenses" (echo Accepted Android SDK licenses folder found) else (echo Android SDK licenses folder is not present & exit /b 1)

      - name: Install dependencies
        shell: cmd
        run: npm install --include=dev

      - name: Type-check application
        shell: cmd
        run: npm run typecheck

      - name: Resolve application version
        id: app_version
        shell: cmd
        run: for /f "delims=" %%V in ('node -p "require('./package.json').version"') do echo version=%%V>>"%GITHUB_OUTPUT%"

      - name: Create Android project
        shell: cmd
        run: npx expo prebuild --platform android --non-interactive
        env:
          NODE_ENV: production

      - name: Point Gradle to local Android SDK
        shell: cmd
        run: echo sdk.dir=C:/actions-runner/android-sdk>android\local.properties

      - name: Build release APK
        shell: cmd
        working-directory: android
        run: gradlew.bat app:assembleRelease --no-daemon
        env:
          NODE_ENV: production

      - name: Prepare APK for release
        shell: cmd
        run: copy /Y "android\app\build\outputs\apk\release\app-release.apk" "Aparatchi-Android-Release.apk"

      # Publish with the local Node runtime instead of actions/github-script.
      # This keeps the workflow free of all external `uses:` action downloads.
      - name: Publish APK to GitHub Releases
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.app_version.outputs.version }}
          RELEASE_TAG: android-latest
          APK_PATH: Aparatchi-Android-Release.apk
        run: node scripts/publish-apk-release.mjs
