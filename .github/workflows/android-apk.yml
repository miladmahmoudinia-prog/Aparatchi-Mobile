name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-apk.yml

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          test -f "$ANDROID_SDK_ROOT/ndk/27.1.12297006/build/cmake/android.toolchain.cmake"
          test -x "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"

      - name: Install dependencies
        run: npm install --include=dev

      - name: Type-check application
        run: npm run typecheck

      - name: Resolve application version
        id: app_version
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Create Android project
        run: npx expo prebuild --platform android
        env:
          NODE_ENV: production
          CI: "1"

      - name: Point Gradle to Android SDK
        shell: bash
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build release APK
        working-directory: android
        shell: bash
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew app:assembleRelease --no-daemon

      - name: Prepare APK for release
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk Aparatchi-Android-Release.apk

      - name: Publish APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.app_version.outputs.version }}
          RELEASE_TAG: android-latest
          APK_PATH: Aparatchi-Android-Release.apk
        run: node scripts/publish-apk-release.mjs
