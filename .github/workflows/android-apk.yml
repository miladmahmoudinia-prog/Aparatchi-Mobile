name: Apply verified mobile repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 120

      - name: Expose repair run id
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'run_id=%s\nhead_sha=%s\nstarted_at=%s\n' "${{ github.run_id }}" "${{ github.sha }}" "$(date -u +%FT%TZ)" > mobile-v18-run.txt
          git add mobile-v18-run.txt
          git commit -m "chore: expose verified mobile v18 run id [skip ci]"
          git push origin HEAD:main

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Apply bounded fresh startup
        run: node scripts/apply-startup-freshness-v17.mjs

      - name: Apply collection title and Back-scroll repair
        run: node scripts/patch-collection-navigation-v18.mjs

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Type-check application
        run: npm run typecheck

      - name: Verify startup and collection regressions
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Bootstrap transport is finished before the large index begins" App.tsx
          grep -F "}, 5600);" App.tsx
          grep -F "let collectionBrowserScrollOffset = 0;" App.tsx
          grep -F "const posterNameFa = String(item.nameFa || item.name || '').trim();" App.tsx
          grep -F "const collectionFolderListRef = useRef<any>(null);" App.tsx
          grep -F "offset: collectionBrowserScrollOffset" App.tsx
          grep -F "collectionBrowserScrollOffset = Math.max(0, event.nativeEvent.contentOffset.y)" App.tsx
          ! grep -F "[A-Za-z]/.test(item.nameFa || '') && item.collectionNameFa" App.tsx
          ! grep -F ': `مجموعه ${firstFa' App.tsx

      - name: Commit verified repair and restore manual APK workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git show 9b0974a73d7eb971d67c8e6c1cb8301a003016cb:.github/workflows/android-apk.yml > .github/workflows/android-apk.yml

          cat >> PROJECT-STATE.md <<'EOF'

# milestone Verified startup + collection identity v18 — 2026-08-18
- Cold start now prefers the small current Home bootstrap before starting the large full index; the emergency startup escape is bounded at 5.6 seconds.
- Individual movie/series cards always use the work's own title and never substitute `collectionNameFa`.
- Collection folders use collection identity only; missing Persian collection metadata no longer manufactures a folder name from the first installment.
- Collection folder pixel scroll position is preserved and restored after header Back and Android hardware Back.
- No APK was built by this repair workflow; the normal manual APK workflow was restored afterward.
EOF

          rm -f mobile-v18-run.txt
          git rm -f --ignore-unmatch \
            scripts/apply-startup-freshness-v17.mjs \
            scripts/patch-collection-navigation-v18.mjs \
            scripts/patch-collection-title-scroll-v18.mjs \
            .github/workflows/startup-freshness-v17.yml \
            .github/workflows/collection-navigation-v18.yml \
            .github/workflows/collection-navigation-v18-issue.yml
          git add App.tsx PROJECT-STATE.md .github/workflows/android-apk.yml
          git commit -m "fix: finalize startup and collection navigation truth"
          git pull --rebase origin main
          git push origin HEAD:main
