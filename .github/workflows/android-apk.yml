name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Temporary bridge while GitHub-hosted Actions quota is unavailable.
    # Keep these labels aligned with the registered Windows x64 runner.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    env:
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "12266719"
          log-accepted-android-sdk-licenses: "false"

      # The Windows runner service account blocks PowerShell scripts by policy,
      # so all command steps intentionally use cmd.
      - name: Install dependencies
        shell: cmd
        run: npm install --include=dev

      - name: Type-check application
        shell: cmd
        run: npm run typecheck

      - name: Resolve application version
        id: app_version
        shell: cmd
        run: for /f "delims=" %%V in ('node -p "require('./package.json').version"') do echo version=%%V>>"%GITHUB_OUTPUT%"

      - name: Create Android project
        shell: cmd
        run: npx expo prebuild --platform android --non-interactive
        env:
          NODE_ENV: production

      - name: Build release APK
        shell: cmd
        working-directory: android
        run: gradlew.bat app:assembleRelease --no-daemon
        env:
          NODE_ENV: production

      - name: Prepare APK for release
        shell: cmd
        run: copy /Y "android\app\build\outputs\apk\release\app-release.apk" "Aparatchi-Android-Release.apk"

      # Publish directly to Releases so large APKs do not consume Actions artifact storage.
      - name: Publish APK to GitHub Releases
        uses: actions/github-script@v8
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
          RELEASE_TAG: android-latest
          APK_PATH: Aparatchi-Android-Release.apk
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.RELEASE_TAG;
            const version = process.env.APP_VERSION;
            const apkPath = path.resolve(process.env.APK_PATH);
            const apkName = path.basename(apkPath);
            const releaseName = `Aparatchi Android v${version}`;
            const releaseBody = `Latest Android APK for Aparatchi v${version}.`;

            if (!fs.existsSync(apkPath)) {
              throw new Error(`APK not found at ${apkPath}`);
            }

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              release = (await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                name: releaseName,
                body: releaseBody,
                draft: false,
                prerelease: false,
                make_latest: 'true',
              })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: releaseName,
                body: releaseBody,
                draft: false,
                prerelease: false,
                make_latest: 'true',
              })).data;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });
            for (const asset of assets) {
              if (asset.name === apkName) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
            }

            const data = fs.readFileSync(apkPath);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: apkName,
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': data.length,
              },
              data,
            });

            core.notice(`Published ${apkName} to ${tag} (${releaseName}).`);
