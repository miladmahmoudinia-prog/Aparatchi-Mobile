name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    env:
      EXPO_NO_TELEMETRY: "1"
      ANDROID_HOME: C:/actions-runner/android-sdk
      ANDROID_SDK_ROOT: C:/actions-runner/android-sdk
      TOOL_ROOT: C:/actions-runner/tools
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Activate persistent runner tools
        shell: cmd
        run: |
          @echo off
          setlocal EnableDelayedExpansion
          if not exist "%TOOL_ROOT%" mkdir "%TOOL_ROOT%"

          set "GIT_EXE=%TOOL_ROOT%\mingit\cmd\git.exe"
          if not exist "!GIT_EXE!" (
            echo Installing portable MinGit once...
            curl.exe -fL --retry 4 --retry-delay 3 -o "%RUNNER_TEMP%\mingit.zip" "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.4/MinGit-2.55.0.4-64-bit.zip" || exit /b 1
            if exist "%TOOL_ROOT%\mingit" rmdir /s /q "%TOOL_ROOT%\mingit"
            mkdir "%TOOL_ROOT%\mingit" || exit /b 1
            tar.exe -xf "%RUNNER_TEMP%\mingit.zip" -C "%TOOL_ROOT%\mingit" || exit /b 1
          )
          echo %TOOL_ROOT%\mingit\cmd>>"%GITHUB_PATH%"

          set "NODE_DIR=C:\actions-runner\_work\_tool\node\22.23.2\x64"
          if not exist "!NODE_DIR!\node.exe" set "NODE_DIR=%TOOL_ROOT%\node-v22.23.2-win-x64"
          if not exist "!NODE_DIR!\node.exe" (
            echo Installing portable Node 22 once...
            curl.exe -fL --retry 4 --retry-delay 3 -o "%RUNNER_TEMP%\node22.zip" "https://nodejs.org/dist/v22.23.2/node-v22.23.2-win-x64.zip" || exit /b 1
            tar.exe -xf "%RUNNER_TEMP%\node22.zip" -C "%TOOL_ROOT%" || exit /b 1
          )
          echo !NODE_DIR!>>"%GITHUB_PATH%"

          set "JAVA_DIR="
          for /d %%D in ("%TOOL_ROOT%\java17\*") do if not defined JAVA_DIR if exist "%%~fD\bin\java.exe" set "JAVA_DIR=%%~fD"
          if not defined JAVA_DIR (
            echo Installing portable Java 17 once...
            curl.exe -fL --retry 4 --retry-delay 3 -o "%RUNNER_TEMP%\java17.zip" "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jdk/hotspot/normal/eclipse?project=jdk" || exit /b 1
            if exist "%TOOL_ROOT%\java17" rmdir /s /q "%TOOL_ROOT%\java17"
            mkdir "%TOOL_ROOT%\java17" || exit /b 1
            tar.exe -xf "%RUNNER_TEMP%\java17.zip" -C "%TOOL_ROOT%\java17" || exit /b 1
            for /d %%D in ("%TOOL_ROOT%\java17\*") do if not defined JAVA_DIR if exist "%%~fD\bin\java.exe" set "JAVA_DIR=%%~fD"
          )
          if not defined JAVA_DIR exit /b 1
          echo !JAVA_DIR!\bin>>"%GITHUB_PATH%"
          echo JAVA_HOME=!JAVA_DIR!>>"%GITHUB_ENV%"
          endlocal

      - name: Sync project with local Git
        shell: cmd
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if not exist ".git" git init .
          git config core.longpaths true
          git fetch --force --no-tags --prune --depth=1 "https://x-access-token:%GH_TOKEN%@github.com/%GITHUB_REPOSITORY%.git" "%GITHUB_SHA%" || exit /b 1
          git reset --hard %GITHUB_SHA% || exit /b 1
          git clean -ffdx

      - name: Verify base toolchain
        shell: cmd
        run: |
          git --version || exit /b 1
          node --version || exit /b 1
          npm --version || exit /b 1
          "%JAVA_HOME%\bin\java.exe" -version || exit /b 1
          if not exist "%ANDROID_HOME%\licenses" exit /b 1

      - name: Prepare exact Android NDK
        shell: cmd
        run: call scripts\prepare-ndk.cmd

      - name: Prepare Android 16 SDK packages
        shell: cmd
        run: call scripts\bootstrap-android-sdk.cmd

      - name: Prepare CMake and Android SDK packages
        shell: cmd
        run: call scripts\prepare-cmake.cmd

      - name: Install dependencies
        shell: cmd
        run: npm install --include=dev

      - name: Type-check application
        shell: cmd
        run: npm run typecheck

      - name: Resolve application version
        id: app_version
        shell: cmd
        run: for /f "delims=" %%V in ('node -p "require('./package.json').version"') do echo version=%%V>>"%GITHUB_OUTPUT%"

      - name: Create Android project
        shell: cmd
        run: npx expo prebuild --platform android
        env:
          NODE_ENV: production
          CI: "1"

      - name: Configure Gradle dependency mirrors
        shell: cmd
        run: |
          @echo off
          >android\aparatchi-mirrors.init.gradle echo def addRepos = { h -^>
          >>android\aparatchi-mirrors.init.gradle echo h.maven { url = uri('https://maven.aliyun.com/repository/google') }
          >>android\aparatchi-mirrors.init.gradle echo h.maven { url = uri('https://maven.aliyun.com/repository/gradle-plugin') }
          >>android\aparatchi-mirrors.init.gradle echo h.maven { url = uri('https://maven.aliyun.com/repository/public') }
          >>android\aparatchi-mirrors.init.gradle echo h.google()
          >>android\aparatchi-mirrors.init.gradle echo h.mavenCentral()
          >>android\aparatchi-mirrors.init.gradle echo h.gradlePluginPortal()
          >>android\aparatchi-mirrors.init.gradle echo }
          >>android\aparatchi-mirrors.init.gradle echo settingsEvaluated { s -^>
          >>android\aparatchi-mirrors.init.gradle echo addRepos(s.pluginManagement.repositories)
          >>android\aparatchi-mirrors.init.gradle echo try { addRepos(s.dependencyResolutionManagement.repositories) } catch (ignored) {}
          >>android\aparatchi-mirrors.init.gradle echo }
          >>android\aparatchi-mirrors.init.gradle echo gradle.beforeProject { p -^>
          >>android\aparatchi-mirrors.init.gradle echo addRepos(p.buildscript.repositories)
          >>android\aparatchi-mirrors.init.gradle echo addRepos(p.repositories)
          >>android\aparatchi-mirrors.init.gradle echo }

      - name: Point Gradle to persistent Android SDK
        shell: cmd
        run: echo sdk.dir=C:/actions-runner/android-sdk>android\local.properties

      - name: Build release APK
        shell: cmd
        working-directory: android
        run: gradlew.bat -I aparatchi-mirrors.init.gradle app:assembleRelease --no-daemon
        env:
          NODE_ENV: production

      - name: Prepare APK for release
        shell: cmd
        run: copy /Y "android\app\build\outputs\apk\release\app-release.apk" "Aparatchi-Android-Release.apk"

      - name: Publish APK to GitHub Releases
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.app_version.outputs.version }}
          RELEASE_TAG: android-latest
          APK_PATH: Aparatchi-Android-Release.apk
        run: node scripts/publish-apk-release.mjs
