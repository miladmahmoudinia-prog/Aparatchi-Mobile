name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/apk-build-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPO_NO_TELEMETRY: "1"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT"
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          test -f "$ANDROID_SDK_ROOT/ndk/27.1.12297006/build/cmake/android.toolchain.cmake"
          test -x "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"

      - name: Install dependencies
        run: npm install --include=dev

      - name: Refresh bundled startup catalog
        run: node scripts/refresh-bundled-bootstrap.mjs

      - name: Check catalog and download recovery
        run: node --test scripts/tests/catalog-revision-integrity.test.mjs scripts/tests/download-response-recovery.test.mjs scripts/tests/playback-*.test.mjs scripts/tests/catalog-cache-recovery.test.mjs scripts/tests/catalog-fallback-offline.test.mjs scripts/tests/startup-live-truth-v46.test.mjs scripts/tests/live-catalog-growth-v44.test.mjs scripts/tests/instant-startup-cache-v41.test.mjs scripts/tests/background-catalog-v44.test.mjs

      - name: Type-check application
        run: npm run typecheck

      - name: Resolve application version
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Android project
        run: npx expo prebuild --platform android
        env:
          NODE_ENV: production
          CI: "1"

      - name: Point Gradle to Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build release APK
        working-directory: android
        shell: bash
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew app:assembleRelease --no-daemon --console=plain 2>&1 | tee /tmp/apk-build.log || {
            awk '/What went wrong:/{p=1} /Try:/{p=0} p' /tmp/apk-build.log | head -9 | while IFS= read -r line; do echo "::error::$line"; done
            grep -Ei 'Unable to resolve|Cannot find module|ENOENT|No space left' /tmp/apk-build.log | head -2 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Verify upgrade signing compatibility
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/miladmahmoudinia-prog/Aparatchi-Mobile/releases/download/android-test-0.16.44/Aparatchi-Android-Release.apk' -o /tmp/previous.apk
          SIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$SIGNER" verify --print-certs /tmp/previous.apk > /tmp/previous-cert.txt
          "$SIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk > /tmp/candidate-cert.txt
          grep '^Signer #1 certificate SHA-256 digest:' /tmp/previous-cert.txt > /tmp/previous-sha.txt
          grep '^Signer #1 certificate SHA-256 digest:' /tmp/candidate-cert.txt > /tmp/candidate-sha.txt
          diff -u /tmp/previous-sha.txt /tmp/candidate-sha.txt

      - name: Prepare APK for release
        run: cp android/app/build/outputs/apk/release/app-release.apk Aparatchi-Android-Release.apk

      - name: Publish APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.app_version.outputs.version }}
          RELEASE_TAG: android-test-0.16.45
          APK_PATH: Aparatchi-Android-Release.apk
        run: node scripts/publish-apk-release.mjs
